<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录指导师工作台 · AIPIWEN</title>
  <meta name="description" content="AIPIWEN 指导师工作台统一登录入口">
  <link rel="stylesheet" href="static/ai-interpreter.css">
  <script src="static/v3a-auth.js" defer></script>
</head>
<body data-v3a-auth-page="login">
  <main class="public-shell auth-shell">
    <nav class="public-nav" aria-label="指导师登录导航">
      <a class="brand" href="advisor.html" aria-label="AIPIWEN 指导师工作台">
        <svg class="brand-flower" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle class="brand-flower-ring" cx="18" cy="18" r="15.5" stroke-width=".9" stroke-dasharray="2.5 6"/>
          <g class="brand-flower-petals">
            <ellipse cx="18" cy="12" rx="2.2" ry="6.5" transform="rotate(0 18 18)"/>
            <ellipse cx="18" cy="12" rx="2.2" ry="6.5" transform="rotate(90 18 18)"/>
            <ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(45 18 18)"/>
            <ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(135 18 18)"/>
          </g>
          <circle class="brand-flower-center" cx="18" cy="18" r="3"/>
        </svg>
        <div>
          <p class="brand-title">AIPIWEN指导师工作台</p>
          <div class="brand-subtitle">统一登录</div>
        </div>
      </a>
      <a class="btn ghost" href="advisor.html">返回工作台介绍</a>
    </nav>

    <section class="auth-layout">
      <div class="module auth-card auth-card-centered">
        <span class="status pending" id="v3a-phone-login-status">正在检查短信登录状态</span>
        <p class="eyebrow" style="margin-top:14px">Advisor Login</p>
        <h1>登录指导师工作台</h1>

        <div class="auth-tabs" role="tablist" aria-label="登录方式">
          <button class="auth-tab active" id="v3a-password-tab" type="button" data-auth-mode="password">手机号码和密码</button>
          <button class="auth-tab" id="v3a-sms-tab" type="button" data-auth-mode="sms">短信验证码</button>
        </div>

        <form class="form-grid auth-pane" id="v3a-password-login-form" novalidate>
          <label for="v3a-password-phone">中国大陆手机号
            <input class="field" id="v3a-password-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="17" placeholder="请输入 11 位手机号" required>
          </label>
          <label for="v3a-login-password">登录密码
            <input class="field" id="v3a-login-password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="请输入登录密码" required>
          </label>
          <button class="btn ghost" id="v3a-forgot-password" type="button">忘记密码？用短信验证码重设</button>
          <button class="btn primary" type="submit">登录</button>
        </form>

        <form class="form-grid auth-pane" id="v3a-phone-auth-form" novalidate hidden>
          <label for="v3a-phone">中国大陆手机号
            <input class="field" id="v3a-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="17" placeholder="请输入 11 位手机号" required>
          </label>
          <label for="v3a-otp">短信验证码
            <span class="code-row">
              <input class="field" id="v3a-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 位验证码" required>
              <button class="btn ghost" id="v3a-send-otp" type="button">获取验证码</button>
            </span>
          </label>
          <p class="dryrun-error" id="v3a-login-message" role="status" aria-live="polite" hidden></p>
          <button class="btn primary" type="submit">登录</button>
        </form>
        <p class="dryrun-error" id="v3a-password-login-message" role="status" aria-live="polite" hidden></p>
      </div>
      <p class="auth-helper-text" id="v3a-phone-login-description">第一次使用或忘记密码，请切换到短信验证码。</p>
    </section>
  </main>
</body>
</html>
