<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AIPIWEN · 专属报告</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0E1118;--amber:#C2692A;--amber-dim:rgba(194,105,42,.32);
  --amber-glow:rgba(185,100,35,.5);--text:#FDFCF8;
  --dim:rgba(253,252,248,.6);--faint:rgba(253,252,248,.28);
  --card:rgba(255,255,255,.03);--border:rgba(255,255,255,.07);
  --w:390px;
}
html,body{height:100%;overflow:hidden;background:#060810;
  font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
  color:var(--text);}
#app{display:flex;align-items:center;justify-content:center;
  min-height:100%;min-height:100dvh;}
/* ── CARD SHELL ── */
#card{position:relative;width:var(--w);height:100vh;height:100dvh;
  overflow:hidden;background:var(--bg);
  box-shadow:0 0 100px rgba(194,105,42,.06),0 40px 80px rgba(0,0,0,.7);}
@media(min-height:860px){#card{height:860px;border-radius:28px;}}
@media(max-width:430px){
  #app{background:var(--bg);}
  #card{width:100vw;border-radius:0;height:100dvh;}
}
/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  overflow-y:auto;scrollbar-width:none;}
.screen::-webkit-scrollbar{display:none;}
.screen.active{display:flex;}

/* ── SHARED TOP BAR ── */
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;
  background:linear-gradient(var(--bg) 55%,transparent);position:sticky;top:0;z-index:10;}
.topbar-logo{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--amber);}
.back-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:9px;padding:0 10px;height:30px;
  color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;}
.step-dots{display:flex;gap:5px;}
.sdot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);transition:all .3s;}
.sdot.active{width:16px;background:var(--amber);}
.sdot.done{background:rgba(194,105,42,.5);}

/* ─── SCREEN 1: UPLOAD ─── */
#s1{padding:0;}
.s1-body{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 28px 40px;gap:0;}
.s1-title{font-family:Georgia,'Noto Serif SC',serif;font-size:24px;font-weight:700;
  text-align:center;margin-bottom:8px;}
.s1-sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:32px;line-height:1.7;}
.dropzone{width:100%;border:1.5px dashed rgba(194,105,42,.4);border-radius:20px;
  padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;transition:border-color .2s,background .2s;position:relative;
  background:rgba(194,105,42,.03);}
.dropzone:hover,.dropzone.drag{border-color:var(--amber);background:rgba(194,105,42,.07);}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dz-icon{font-size:40px;line-height:1;}
.dz-label{font-size:14px;color:var(--dim);font-weight:500;}
.dz-hint{font-size:11.5px;color:var(--faint);}
.s1-divider{display:flex;align-items:center;gap:10px;width:100%;margin:20px 0;color:var(--faint);font-size:12px;}
.s1-divider::before,.s1-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.camera-btn{width:100%;height:48px;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:14px;color:var(--dim);font-size:14px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.camera-btn input{position:absolute;opacity:0;width:0;height:0;}
.s1-tip{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.7;margin-top:20px;}
#s1-preview{display:none;margin-top:16px;width:100%;border-radius:14px;overflow:hidden;}
#s1-preview img{width:100%;display:block;border-radius:14px;}
#s1-status{font-size:13px;color:var(--amber);text-align:center;margin-top:12px;min-height:18px;}
#s1-extract-btn{display:none;width:100%;height:52px;background:var(--amber);color:var(--bg);
  border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  margin-top:16px;transition:opacity .2s;}
#s1-extract-btn:disabled{opacity:.5;}

/* ─── SCREEN 2: CONFIRM ─── */
#s2{padding:0;}
.s2-body{flex:1;padding:12px 20px 80px;}
.s2-section-label{font-size:10.5px;letter-spacing:.14em;color:var(--amber);
  text-transform:uppercase;font-weight:700;margin:16px 0 10px;}
/* finger grid */
.finger-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.finger-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;}
.fc-label{font-size:10px;color:var(--faint);margin-bottom:6px;}
.fc-row{display:flex;gap:6px;align-items:center;}
.fc-sym{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;color:var(--text);font-size:13px;font-family:inherit;
  -webkit-appearance:none;}
.fc-trc{width:52px;background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;color:var(--text);font-size:13px;font-family:inherit;
  text-align:center;}
.fc-sym option{background:#1a1d24;color:var(--text);}
/* ATD + age row */
.info-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.info-field{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.if-label{font-size:10px;color:var(--faint);margin-bottom:4px;}
.if-input{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;
  font-family:inherit;outline:none;}
.s2-confirm-btn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:var(--w);max-width:100%;padding:12px 20px 24px;
  background:linear-gradient(transparent,rgba(14,17,24,.98) 28%);z-index:20;}
@media(max-width:430px){.s2-confirm-btn{width:100%;}}
.confirm-btn-inner{width:100%;height:52px;background:var(--amber);color:var(--bg);
  border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ─── SCREEN 3: ISSUES ─── */
#s3{padding:0;}
.s3-body{flex:1;padding:12px 20px 80px;}
.must-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.must-item{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:rgba(194,105,42,.06);border:1px solid rgba(194,105,42,.18);
  border-radius:12px;font-size:13.5px;color:var(--amber);}
.must-item::before{content:'✓';font-size:11px;opacity:.7;}
.issue-grid{display:flex;flex-wrap:wrap;gap:8px;}
.issue-chip{padding:8px 14px;border:1px solid var(--border);border-radius:20px;
  font-size:13px;color:var(--dim);cursor:pointer;transition:all .2s;user-select:none;}
.issue-chip.selected{border-color:var(--amber);color:var(--amber);
  background:rgba(194,105,42,.1);}
.s3-btn-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:var(--w);max-width:100%;padding:12px 20px 24px;
  background:linear-gradient(transparent,rgba(14,17,24,.98) 28%);z-index:20;}
@media(max-width:430px){.s3-btn-wrap{width:100%;}}
.gen-btn{width:100%;height:52px;background:var(--amber);color:var(--bg);
  border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;}
.gen-btn:disabled{opacity:.5;cursor:default;}
#gen-status{font-size:12.5px;color:var(--dim);text-align:center;margin-top:10px;}

/* ─── SCREEN 4: REPORT (flip-book) ─── */
#s4{padding:0;background:var(--bg);}
/* reuse from report-viewer */
#rv-viewer{position:relative;width:100%;height:100%;overflow:hidden;}
#rv-track{display:flex;height:100%;transition:transform .42s cubic-bezier(.25,.46,.45,.94);will-change:transform;}
.rv-slide{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;
  padding:60px 26px 72px;scrollbar-width:none;}
.rv-slide::-webkit-scrollbar{display:none;}
/* slide content styles (same as report-viewer) */
.sec-eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.15em;
  color:var(--amber);text-transform:uppercase;font-weight:700;margin-bottom:14px;}
.sec-eyebrow::before{content:'';width:18px;height:1px;background:var(--amber);}
.sec-h{font-family:Georgia,'Noto Serif SC',serif;font-size:26px;font-weight:700;
  color:var(--text);margin-bottom:16px;line-height:1.3;}
.sec-body{font-size:14.5px;color:var(--dim);line-height:1.9;}
.sec-body strong{color:var(--text);font-weight:600;}
.sec-body em{color:var(--amber);font-style:normal;}
/* four-part */
.fp-parts{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
.fp-part{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;}
.fp-badge{display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;}
.fp-badge-n{width:18px;height:18px;background:var(--amber);color:var(--bg);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;}
.fp-badge-t{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;}
.fp-text{font-size:13.5px;color:var(--dim);line-height:1.8;}
.fp-text strong{color:var(--text);}
.fp-text em{color:var(--amber);font-style:normal;}
.fp-cta-btn{display:flex;align-items:center;gap:9px;
  background:rgba(194,105,42,.1);border:1px solid var(--amber-dim);
  border-radius:12px;padding:12px 14px;margin-top:4px;
  font-size:13px;color:var(--amber);cursor:pointer;transition:background .2s;
  font-family:inherit;width:100%;text-align:left;}
/* cover slide */
.cv-fp{text-align:center;margin:16px 0 20px;}
.cv-fp img{width:196px;height:196px;object-fit:contain;filter:drop-shadow(0 0 36px var(--amber-glow));}
.cv-type{font-family:Georgia,'Noto Serif SC',serif;font-size:38px;font-weight:700;
  text-align:center;color:var(--text);margin-bottom:8px;}
.cv-line{width:40px;height:2px;background:var(--amber);margin:0 auto 18px;border-radius:1px;}
.cv-tagline{font-size:13.5px;color:var(--dim);text-align:center;line-height:1.75;margin-bottom:22px;}
.cv-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px;}
.tag{border:1px solid var(--amber-dim);border-radius:20px;padding:5px 13px;font-size:11.5px;color:var(--dim);}
.cv-hr{border:none;border-top:1px solid rgba(255,255,255,.06);margin:0 0 14px;}
.cv-meta{font-size:11px;color:var(--faint);text-align:center;line-height:2.2;}
.cv-meta b{color:var(--amber);}
/* final slide */
.fin-fp{text-align:center;margin:8px 0 18px;}
.fin-fp img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 20px var(--amber-glow));}
.fin-h{font-family:Georgia,'Noto Serif SC',serif;font-size:22px;font-weight:700;text-align:center;margin-bottom:10px;}
.fin-sub{font-size:13px;color:var(--dim);text-align:center;line-height:1.75;margin-bottom:28px;}
.btn-row{display:flex;flex-direction:column;gap:10px;}
.btn-primary{width:100%;padding:15px;background:var(--amber);color:var(--bg);
  border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-sec{width:100%;padding:14px;background:transparent;color:var(--dim);
  border:1px solid var(--border);border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit;}
/* nav */
#rv-topbar{position:absolute;top:0;left:0;right:0;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:100;
  background:linear-gradient(var(--bg) 55%,transparent);}
.rv-tbtn{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:9px;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
#rv-botnav{position:absolute;bottom:0;left:0;right:0;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:100;
  background:linear-gradient(transparent,rgba(14,17,24,.96) 22%);}
.rnav-btn{width:36px;height:36px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:50%;color:var(--text);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rnav-btn:disabled{opacity:.25;cursor:default;}
#rv-dots{display:flex;gap:5px;align-items:center;}
.rdot{width:6px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;transition:all .3s;cursor:pointer;}
.rdot.active{width:20px;background:var(--amber);}
/* TOC drawer */
#rv-drawer{position:absolute;top:0;left:-105%;width:100%;height:100%;
  background:rgba(8,10,16,.97);backdrop-filter:blur(20px);
  z-index:200;padding:56px 24px 80px;
  transition:left .38s cubic-bezier(.25,.46,.45,.94);overflow-y:auto;scrollbar-width:none;}
#rv-drawer.open{left:0;}
#rv-drawer::-webkit-scrollbar{display:none;}
#rv-drawer-close{position:absolute;top:14px;right:16px;width:32px;height:32px;
  background:rgba(255,255,255,.07);border:none;border-radius:50%;
  color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dr-label{font-size:10px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;
  margin-bottom:20px;font-weight:700;}
.dr-item{display:flex;align-items:flex-start;gap:14px;padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;}
.dr-num{width:30px;height:30px;flex-shrink:0;border:1px solid var(--amber-dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--amber);margin-top:1px;}
.dr-num.cur{background:var(--amber);color:var(--bg);border-color:var(--amber);}
.dr-title{font-size:15px;color:var(--text);line-height:1.35;}
.dr-sub{font-size:12px;color:var(--faint);margin-top:3px;}
/* loading slide */
.loading-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:16px;padding:40px;}
.ls-ring{width:48px;height:48px;border:3px solid rgba(194,105,42,.2);
  border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ls-text{font-size:14px;color:var(--dim);text-align:center;line-height:1.7;}
/* share modal */
#smodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);
  backdrop-filter:blur(12px);z-index:1000;align-items:center;
  justify-content:center;flex-direction:column;gap:16px;padding:24px;}
#smodal.open{display:flex;}
.fp-card{width:300px;background:var(--bg);border:1px solid rgba(194,105,42,.18);
  border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:0;}
.fpc-brand{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--amber);
  text-transform:uppercase;margin-bottom:14px;align-self:flex-start;}
.fpc-fp{margin-bottom:12px;}
.fpc-fp img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 22px var(--amber-glow));}
.fpc-type{font-family:Georgia,'Noto Serif SC',serif;font-size:30px;font-weight:700;
  color:var(--text);margin-bottom:6px;text-align:center;}
.fpc-hook{font-size:12px;color:var(--dim);text-align:center;line-height:1.65;
  margin-bottom:14px;white-space:pre-line;}
.fpc-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
.fpc-tag{border:1px solid var(--amber-dim);border-radius:20px;padding:3px 10px;font-size:10.5px;color:var(--dim);}
.fpc-hr{width:100%;height:1px;background:rgba(255,255,255,.06);margin-bottom:10px;}
.fpc-foot{font-size:9.5px;color:var(--faint);text-align:center;letter-spacing:.08em;line-height:2;}
.fpc-foot b{color:var(--amber);}
.smodal-btns{display:flex;gap:10px;width:300px;}
.smodal-btns button{flex:1;padding:13px;border:none;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
#sm-save{background:var(--amber);color:var(--bg);}
#sm-close{background:rgba(255,255,255,.08);color:var(--dim);}
</style>
</head>
<body>
<div id="app">
<div id="card">

<!-- ── SCREEN 1: 上传总表 ── -->
<div class="screen active" id="s1">
  <div class="topbar">
    <div class="topbar-logo">AIPIWEN</div>
    <div class="step-dots">
      <div class="sdot active" id="d1"></div>
      <div class="sdot" id="d2"></div>
      <div class="sdot" id="d3"></div>
      <div class="sdot" id="d4"></div>
    </div>
  </div>
  <div class="s1-body">
    <div class="s1-title">上传总表页</div>
    <div class="s1-sub">上传皮纹测评报告的<strong>总表页</strong>图片<br>AI 自动读取十指数据</div>
    <div class="dropzone" id="dropzone">
      <input type="file" id="file-gallery" accept="image/*">
      <div class="dz-icon">📄</div>
      <div class="dz-label">点击选择图片</div>
      <div class="dz-hint">支持 JPG / PNG / HEIC</div>
    </div>
    <div class="s1-divider">或</div>
    <label class="camera-btn">
      <span>📷&nbsp; 拍照上传</span>
      <input type="file" id="file-camera" accept="image/*" capture="environment">
    </label>
    <div id="s1-preview"><img id="preview-img" src="" alt=""></div>
    <div id="s1-status"></div>
    <button id="s1-extract-btn" disabled>识别数据 →</button>
    <div class="s1-tip">图片需清晰显示总表页中的纹型符号和 TRC 数值<br>系统读取后会让你逐项确认</div>
  </div>
</div>

<!-- ── SCREEN 2: 确认数据 ── -->
<div class="screen" id="s2">
  <div class="topbar">
    <button class="back-btn" id="s2-back">← 返回</button>
    <div class="step-dots">
      <div class="sdot done" id="d1b"></div>
      <div class="sdot active" id="d2b"></div>
      <div class="sdot" id="d3b"></div>
      <div class="sdot" id="d4b"></div>
    </div>
  </div>
  <div class="s2-body">
    <div class="s2-section-label">确认数据 — AI读到的是这样，对吗？</div>
    <div class="info-row">
      <div class="info-field">
        <div class="if-label">年龄</div>
        <input class="if-input" id="conf-age" type="number" placeholder="岁" min="1" max="99">
      </div>
      <div class="info-field">
        <div class="if-label">ATD</div>
        <input class="if-input" id="conf-atd" type="number" placeholder="角度" step="0.5" min="20" max="80">
      </div>
      <div class="info-field">
        <div class="if-label">姓名（选填）</div>
        <input class="if-input" id="conf-name" type="text" placeholder="小明">
      </div>
    </div>
    <div class="s2-section-label">十指纹型 & TRC（可修改）</div>
    <div class="finger-grid" id="finger-grid"></div>
  </div>
  <div class="s2-confirm-btn">
    <button class="confirm-btn-inner" id="s2-confirm-btn">确认，选择问题 →</button>
  </div>
</div>

<!-- ── SCREEN 3: 选择问题 ── -->
<div class="screen" id="s3">
  <div class="topbar">
    <button class="back-btn" id="s3-back">← 返回</button>
    <div class="step-dots">
      <div class="sdot done"></div>
      <div class="sdot done"></div>
      <div class="sdot active"></div>
      <div class="sdot"></div>
    </div>
  </div>
  <div class="s3-body">
    <div class="s2-section-label">必给模块（自动包含）</div>
    <div class="must-list" id="must-list"></div>
    <div class="s2-section-label" style="margin-top:20px;">选择你最想了解的问题（最多 3 个）</div>
    <div class="issue-grid" id="issue-grid"></div>
    <div id="gen-status"></div>
  </div>
  <div class="s3-btn-wrap">
    <button class="gen-btn" id="gen-btn">生成专属报告 →</button>
  </div>
</div>

<!-- ── SCREEN 4: 翻页报告 ── -->
<div class="screen" id="s4">
  <div id="rv-viewer">
    <!-- TOC Drawer -->

// ─── UTILITIES ────────────────────────────────────────────────────────────
function qs(sel) { return document.querySelector(sel); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
function getAgeTier(age) {
  const n = Number(age);
  if (n <= 6) return 'preschool';
  if (n <= 12) return 'school';
  if (n <= 15) return 'junior_teen';
  if (n <= 18) return 'senior_teen';
  return 'adult';
}

// ─── SCREEN MANAGEMENT ────────────────────────────────────────────────────
function goScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  qs('#' + id).classList.add('active');
  qs('#' + id).scrollTop = 0;
}

// ─── IMAGE COMPRESSION ────────────────────────────────────────────────────
function compressImage(file, maxW, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        const dataUrl = canvas.toDataURL(mime, quality);
        const b64 = dataUrl.split(',')[1];
        resolve({ b64, mime });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── SCREEN 1: UPLOAD ────────────────────────────────────────────────────
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  qs('#s1-status').textContent = '正在压缩图片…';
  const reader = new FileReader();
  reader.onload = e => {
    qs('#preview-img').src = e.target.result;
    qs('#s1-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);

  compressImage(file, 1600, 0.85).then(({ b64, mime }) => {
    ST.imageBase64 = b64;
    ST.imageMimeType = mime;
    qs('#s1-status').textContent = '图片准备好了，点击"识别数据"';
    qs('#s1-extract-btn').disabled = false;
    qs('#s1-extract-btn').style.display = 'block';
  });
}

['file-gallery','file-camera'].forEach(id => {
  qs('#' + id).addEventListener('change', e => handleFile(e.target.files[0]));
});
const dz = qs('#dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  handleFile(e.dataTransfer.files[0]);
});

qs('#s1-extract-btn').addEventListener('click', async () => {
  const btn = qs('#s1-extract-btn');
  btn.disabled = true;
  btn.textContent = '识别中…';
  qs('#s1-status').textContent = 'AI 正在读取总表数据，约需 10-20 秒…';

  try {
    const res = await fetch('/api/extract-fp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: ST.imageBase64, imageMimeType: ST.imageMimeType }),
    });
    const data = await res.json();

    if (!data.ok) {
      if (data.soft) {
        qs('#s1-status').innerHTML = '今天的皮纹识别次数已用完。<br>明天继续使用，或 <a href="https://aipiwen.cn" style="color:#C2692A">邀请朋友体验</a> 获得更多次数。';
      } else {
        qs('#s1-status').textContent = '❌ ' + (data.error || '识别失败，请重试');
      }
      btn.disabled = false;
      btn.textContent = '重新识别';
      return;
    }

    ST.fingers = data.fingers;
    ST.atd = data.atd;
    ST.age = data.age;
    ST.name = data.name;
    buildConfirmScreen();
    goScreen('s2');
  } catch(err) {
    qs('#s1-status').textContent = '❌ 网络错误，请重试';
    btn.disabled = false;
    btn.textContent = '重新识别';
  }
});

// ─── SCREEN 2: CONFIRM ───────────────────────────────────────────────────
function buildConfirmScreen() {
  qs('#conf-age').value  = ST.age  || '';
  qs('#conf-atd').value  = ST.atd  || '';
  qs('#conf-name').value = ST.name || '';

  const grid = qs('#finger-grid');
  grid.innerHTML = '';
  FINGER_KEYS.forEach(key => {
    const f = (ST.fingers || {})[key] || { sym:'Lu', trc:0 };
    const card = el('div', 'finger-card');
    const label = el('div', 'fc-label', FINGER_LABELS[key]);
    const row   = el('div', 'fc-row');

    // sym select
    const sel = document.createElement('select');
    sel.className = 'fc-sym';
    sel.id = 'sym-' + key;
    SYM_OPTIONS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      if (s === f.sym) opt.selected = true;
      sel.appendChild(opt);
    });

    // trc input
    const trcInp = document.createElement('input');
    trcInp.type = 'number'; trcInp.className = 'fc-trc';
    trcInp.id = 'trc-' + key; trcInp.value = f.trc;
    trcInp.min = 0; trcInp.max = 40;

    row.appendChild(sel);
    row.appendChild(trcInp);
    card.appendChild(label);
    card.appendChild(row);
    grid.appendChild(card);
  });
}

        qs('#gen-status').textContent = '最多选 3 个问题';
        setTimeout(() => qs('#gen-status').textContent = '', 2000);
        return;
      }
      chip.classList.toggle('selected', !sel);
      if (!sel) ST.selectedIssues.push(issue);
      else ST.selectedIssues = ST.selectedIssues.filter(x => x !== issue);
      qs('#gen-status').textContent = ST.selectedIssues.length > 0
        ? `已选 ${ST.selectedIssues.length} 个问题` : '';
    });
    grid.appendChild(chip);
  });
}

qs('#s3-back').addEventListener('click', () => goScreen('s2'));

qs('#gen-btn').addEventListener('click', async () => {
  const btn = qs('#gen-btn');
  btn.disabled = true;
  btn.textContent = '正在生成…';
  qs('#gen-status').textContent = 'AI 正在为你生成专属报告，约需 20-40 秒…';

  try {
    const res = await fetch('/api/generate-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        engineResult: ST.engineResult,
        age: ST.age,
        name: ST.name,
        selectedIssues: ST.selectedIssues,
      }),
    });
    const data = await res.json();

    if (!data.ok) {
      if (data.soft) {
        qs('#gen-status').innerHTML = '今天的报告生成次数已用完。<br>明天继续使用，或 <a href="https://aipiwen.cn" style="color:#C2692A">邀请朋友体验</a> 获得更多次数。';
      } else {
        qs('#gen-status').textContent = '❌ ' + (data.error || '生成失败，请重试');
      }
      btn.disabled = false;
      btn.textContent = '重新生成';
      return;
    }

    buildReportFlipBook(data.sections);
    goScreen('s4');
  } catch(err) {
    qs('#gen-status').textContent = '❌ 网络错误，请重试';
    btn.disabled = false;
    btn.textContent = '重新生成';
  }
});

// ─── SCREEN 4: FLIP-BOOK ─────────────────────────────────────────────────
let RV = { cur: 0, total: 0, slides: [] };

function buildReportFlipBook(sections) {
  const track = qs('#rv-track');
  track.innerHTML = '';
  RV.slides = [];

  const E  = ST.engineResult;
  const imgKey = KEY2IMG[E?.key || 'w'] || 'whorl';
  const fpSrc  = FP_IMGS[imgKey];
  const type   = E?.主性格类型 || '天赋型';
  const reportId = `FP-${new Date().getFullYear()}-${(E?.key||'w').toUpperCase().slice(0,2)}${Math.floor(Math.random()*900+100)}`;

  // Slide 0: Cover
  const coverSlide = el('div', 'rv-slide');
  coverSlide.dataset.title = '封面';
  coverSlide.innerHTML = `
    <div class="cv-fp"><img src="${fpSrc}" alt="指纹图"></div>
    <div class="cv-type">${type}</div>
    <div class="cv-line"></div>
    <div class="cv-tagline">${ST.name ? ST.name + ' · ' : ''}${ST.age}岁 · 专属皮纹报告</div>
    <div class="cv-tags">
      ${[type, E?.学习通道?.主通道||'', E?.行为模式?.结论||'', E?.ATD?.分区||''].filter(Boolean).slice(0,4).map(t=>`<div class="tag">${t}</div>`).join('')}
    </div>
    <hr class="cv-hr">
    <div class="cv-meta">报告编号 <b>${reportId}</b><br>生成日期 <b>${new Date().toLocaleDateString('zh-CN')}</b></div>`;
  track.appendChild(coverSlide);
  RV.slides.push({ title:'封面', sub:'' });

  // Content slides from sections
  sections.forEach((sec, i) => {
    const slide = el('div', 'rv-slide');
    slide.dataset.title = sec.title;

    if (sec.type === 'issue') {
      const eyebrow = `Issue ${String(i).padStart(2,'0')} · 家长勾选`;
      slide.dataset.sub = eyebrow;
      slide.innerHTML = `
        <div class="sec-eyebrow">${eyebrow}</div>
        <div class="sec-h">${sec.title}</div>
        <div class="fp-parts">
          <div class="fp-part">
            <div class="fp-badge"><div class="fp-badge-n">1</div><div class="fp-badge-t">为什么</div></div>
            <div class="fp-text">${(sec.why||'').replace(/\n/g,'<br>')}</div>
          </div>
          <div class="fp-part">
            <div class="fp-badge"><div class="fp-badge-n">2</div><div class="fp-badge-t">怎么办</div></div>
            <div class="fp-text">${(sec.how||'').replace(/\n/g,'<br>')}</div>
          </div>
          <div class="fp-part">
            <div class="fp-badge"><div class="fp-badge-n">3</div><div class="fp-badge-t">未来趋势</div></div>
            <div class="fp-text">${(sec.future||'').replace(/\n/g,'<br>')}</div>
          </div>
          <button class="fp-cta-btn" onclick="window.location='/child-chat.html'">
            <span style="font-size:14px">④</span>
            <span>${sec.cta || '还想深聊？继续问我'}</span>
          </button>
        </div>`;
    } else {
      const label = sec.type === 'foundation' ? '必读 · 地基段' : `第${i+1}段 · 必给`;
      slide.dataset.sub = label;
      slide.innerHTML = `
        <div class="sec-eyebrow">${label}</div>
        <div class="sec-h">${sec.title}</div>
        <div class="sec-body">${(sec.content||'').replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}</div>`;
    }
    track.appendChild(slide);
    RV.slides.push({ title: sec.title, sub: slide.dataset.sub || '' });
  });

  // Final slide
  const finSlide = el('div', 'rv-slide');
  finSlide.dataset.title = '继续探索';
  finSlide.innerHTML = `
    <div class="fin-fp"><img src="${fpSrc}" alt=""></div>
    <div class="fin-h">${type}，就是你。</div>
    <div class="fin-sub">这份报告拴着你指尖上的数据。<br>想聊更多，我在这里陪你。</div>
    <div class="btn-row">
      <button class="btn-primary" onclick="window.location='/child-chat.html'">继续深聊 →</button>
      <button class="btn-sec" id="rv-share-open">分享这份报告</button>
      <button class="btn-sec" id="rv-dl-fin">下载报告 PDF</button>
    </div>`;
  track.appendChild(finSlide);
  RV.slides.push({ title:'继续探索', sub:'Next Steps' });

  RV.total = track.children.length;
  RV.cur = 0;

  // Build dots + drawer
  buildRVDots();
  buildRVDrawer();
  rvGoTo(0);

  // Init share poster
  qs('#p-fp').src  = fpSrc;
  qs('#p-type').textContent = type;
  qs('#p-hook').textContent = (POSTER_HOOKS[E?.key||'w'] || '').replace(/\\n/g,'\n');
  const ptags = qs('#p-tags');
  ptags.innerHTML = '';
  [type, E?.学习通道?.主通道||'', E?.行为模式?.结论||''].filter(Boolean).forEach(t => {
    const d = el('div', 'fpc-tag', t); ptags.appendChild(d);
  });

  // Share buttons (added dynamically)
  setTimeout(() => {
    document.querySelectorAll('#rv-share-open,#rv-share-btn').forEach(b => {
      b.addEventListener('click', () => qs('#smodal').classList.add('open'));
    });
    document.querySelectorAll('#rv-dl-fin,#rv-dl-btn').forEach(b => {
      b.addEventListener('click', () => window.print());
    });
  }, 100);
}

// Flip-book navigation
function buildRVDots() {
  const dots = qs('#rv-dots');
  dots.innerHTML = '';
  for (let i = 0; i < RV.total; i++) {
    const d = el('div', 'rdot' + (i===0?' active':''));
    d.addEventListener('click', () => rvGoTo(i));
    dots.appendChild(d);
  }
}

function buildRVDrawer() {
  const container = qs('#rv-drawer-items');
  container.innerHTML = '';
  RV.slides.forEach((s, i) => {
    const item = el('div', 'dr-item');
    const num  = el('div', `dr-num${i===0?' cur':''}`, String(i+1));
    const info = el('div');
    const title = el('div', 'dr-title', s.title);
    const sub   = s.sub ? el('div', 'dr-sub', s.sub) : null;
    info.appendChild(title);
    if (sub) info.appendChild(sub);
    item.appendChild(num);
    item.appendChild(info);
    item.addEventListener('click', () => { rvGoTo(i); qs('#rv-drawer').classList.remove('open'); });
    container.appendChild(item);
  });
}

function rvGoTo(n) {
  RV.cur = Math.max(0, Math.min(n, RV.total - 1));
  const track = qs('#rv-track');
  // each slide is 100% of viewer width
  const slideW = track.parentElement.clientWidth;
  track.style.transform = `translateX(-${RV.cur * slideW}px)`;
  // actually use flex - slides are 100% of container
  track.style.transform = `translateX(-${RV.cur * 100}%)`;
  qs('#rv-dots').querySelectorAll('.rdot').forEach((d,i) => d.classList.toggle('active', i===RV.cur));
  qs('#rv-prev').disabled = RV.cur === 0;
  qs('#rv-next').disabled = RV.cur === RV.total - 1;
  qs('#rv-track').children[RV.cur]?.scrollTo(0, 0);
  // update drawer nums
  qs('#rv-drawer-items').querySelectorAll('.dr-num').forEach((el,i) => el.classList.toggle('cur', i===RV.cur));
}

qs('#rv-prev').addEventListener('click', () => rvGoTo(RV.cur - 1));
qs('#rv-next').addEventListener('click', () => rvGoTo(RV.cur + 1));
qs('#rv-toc-btn').addEventListener('click', () => qs('#rv-drawer').classList.add('open'));
qs('#rv-drawer-close').addEventListener('click', () => qs('#rv-drawer').classList.remove('open'));
document.addEventListener('keydown', e => {
  if (qs('#s4').classList.contains('active')) {
    if (e.key==='ArrowRight') rvGoTo(RV.cur+1);
    if (e.key==='ArrowLeft')  rvGoTo(RV.cur-1);
  }
});
// swipe
let _tx = 0;
qs('#rv-track').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, {passive:true});
qs('#rv-track').addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - _tx;
  if (Math.abs(dx) > 45) rvGoTo(RV.cur + (dx<0?1:-1));
}, {passive:true});

// Share modal
qs('#smodal').addEventListener('click', e => { if(e.target===qs('#smodal')) qs('#smodal').classList.remove('open'); });
qs('#sm-close').addEventListener('click', () => qs('#smodal').classList.remove('open'));
qs('#sm-save').addEventListener('click', async () => {
  try {
    const c = await html2canvas(qs('#poster-card'), {backgroundColor:'#0E1118',scale:3,useCORS:true});
    const a = document.createElement('a');
    a.download = `aipiwen-${ST.engineResult?.主性格类型||'report'}.png`;
    a.href = c.toDataURL('image/png');
    a.click();
  } catch(e) { alert('保存失败，请截图保存'); }
});

// Screen 1 share btn (in report, added lazily)
qs('#rv-share-btn').addEventListener('click', () => qs('#smodal').classList.add('open'));
</script>
