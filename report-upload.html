<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告AI解读 · AIPIWEN</title>
<style>
  :root {
    --brand: #6366f1;
    --brand-dark: #4f46e5;
    --brand-light: #eef2ff;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --ink: #1d1d1f;
    --ink-60: #6e6e73;
    --ink-30: #aeaeb2;
    --surface: #f5f5f7;
    --card: #ffffff;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--surface);
    color: var(--ink);
    overflow: hidden;
  }

  /* ── Nav ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 200;
  }
  .nav-back { font-size: 14px; color: var(--brand); text-decoration: none; }
  .nav-logo { font-size: 16px; font-weight: 700; letter-spacing: -0.5px; }
  .nav-logo span { color: var(--brand); }

  /* ── PRE-UPLOAD PAGE ── */
  .pre-upload {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    overflow-y: auto;
    z-index: 10;
  }
  .pre-upload.hidden { display: none; }

  .page-header {
    padding: 76px 20px 20px;
    text-align: center;
  }
  .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .page-header p { font-size: 14px; color: var(--ink-60); line-height: 1.6; }

  .upload-zone {
    margin: 0 16px 16px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 36px 20px;
    text-align: center;
    background: var(--card);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--brand);
    background: var(--brand-light);
  }
  .upload-zone input[type=file] { display: none; }
  .upload-icon { font-size: 40px; margin-bottom: 12px; }
  .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .upload-hint { font-size: 13px; color: var(--ink-60); margin-bottom: 14px; }
  .upload-formats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .format-tag {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--ink-60);
  }

  /* Report type preview on pre-upload page */
  .report-types-preview {
    margin: 0 16px;
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .rtp-title { font-size: 12px; color: var(--ink-60); margin-bottom: 10px; font-weight: 500; }
  .rtp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rtp-item {
    background: var(--surface);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--ink-60);
    display: flex; align-items: center; gap: 6px;
  }
  .rtp-item.custom { color: var(--purple); background: var(--purple-light); }

  .error-bar {
    display: none; margin: 12px 16px;
    background: #fff5f5; border: 1px solid #fed7d7;
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: #c53030;
  }
  .error-bar.visible { display: block; }

  /* ── CHAT PAGE ── */
  .chat-page {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    background: var(--surface);
  }
  .chat-page.active { display: flex; }

  /* Mini report bar */
  .report-bar {
    position: relative;
    top: 52px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    margin-top: 52px;
  }
  .report-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .report-info { flex: 1; min-width: 0; }
  .report-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .report-status { font-size: 11px; color: var(--ink-60); }
  .reupload-btn { font-size: 12px; color: var(--brand); background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; font-family: inherit; }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .msg { display: flex; gap: 8px; max-width: 90%; }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0; margin-top: 2px;
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
  }
  .msg.ai .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble {
    background: var(--brand);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* Typing indicator */
  .typing { display: none; align-self: flex-start; gap: 8px; align-items: center; }
  .typing.show { display: flex; }
  .typing-inner {
    display: flex; gap: 4px; align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px; border-bottom-left-radius: 4px;
    padding: 10px 14px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-30); animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* ── BOTTOM BAR ── */
  .chat-bottom {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  /* Chip groups */
  .chip-group { margin-bottom: 7px; }
  .chip-group-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--ink-30); text-transform: uppercase;
    margin-bottom: 5px; padding-left: 2px;
  }
  .chip-row {
    display: flex; gap: 6px;
    overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    background: var(--brand-light);
    border: 1.5px solid #c7d2fe;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px; color: var(--brand);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .chip:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
  .chip:active { transform: scale(0.96); }

  .chip.custom {
    background: var(--purple-light);
    border-color: #ddd6fe;
    color: var(--purple);
  }
  .chip.custom:hover { background: var(--purple); color: #fff; border-color: var(--purple); }

  /* Text input row */
  .input-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  .chat-input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 15px; font-family: inherit;
    outline: none; resize: none;
    max-height: 100px; line-height: 1.4;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--brand); }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 12px; background: var(--brand);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.2s;
  }
  .send-btn:hover { background: var(--brand-dark); }
  .send-btn:disabled { background: var(--ink-30); cursor: not-allowed; }
  .send-btn svg { fill: #fff; }
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <a href="/" class="nav-back">← 首页</a>
  <div class="nav-logo">AIPI<span>WEN</span></div>
  <div style="width:48px"></div>
</nav>

<!-- ── PRE-UPLOAD PAGE ── -->
<div class="pre-upload" id="preUpload">
  <div class="page-header">
    <h1>📋 报告 AI 解读</h1>
    <p>上传TRC指纹天赋测评报告截图<br>选择解读方向，AI即时生成专属内容</p>
  </div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="upload-icon">📁</div>
    <div class="upload-title">点击上传 或 拖拽图片至此</div>
    <div class="upload-hint">推荐清晰正面拍摄 · 截图也可以</div>
    <div class="upload-formats">
      <span class="format-tag">JPG</span>
      <span class="format-tag">PNG</span>
      <span class="format-tag">HEIC</span>
      <span class="format-tag">截图</span>
    </div>
  </div>

  <div class="error-bar" id="errorBar"></div>

  <!-- Report type preview -->
  <div class="report-types-preview">
    <div class="rtp-title">上传后可选择的解读方向</div>
    <div class="rtp-grid">
      <div class="rtp-item">📊 基础版个人报告</div>
      <div class="rtp-item">👨‍👩‍👧 亲子合盘报告</div>
      <div class="rtp-item">💑 亲密关系（未婚）</div>
      <div class="rtp-item">💍 亲密关系（已婚）</div>
      <div class="rtp-item custom">💼 职业规划报告</div>
      <div class="rtp-item custom">🧠 学习能力提升</div>
      <div class="rtp-item custom">📚 全阶段学业规划</div>
      <div class="rtp-item custom">🎓 高考志愿报读</div>
      <div class="rtp-item custom">🎨 兴趣班选择</div>
      <div class="rtp-item custom">🧘 身心健康报告</div>
    </div>
  </div>
</div>

<!-- ── CHAT PAGE ── -->
<div class="chat-page" id="chatPage">

  <!-- Mini report bar -->
  <div class="report-bar">
    <img class="report-thumb" id="reportThumb" src="" alt="" />
    <div class="report-info">
      <div class="report-name" id="reportName">报告已上传</div>
      <div class="report-status">选择下方解读方向，AI即时输出专属内容</div>
    </div>
    <button class="reupload-btn" id="reuploadBtn">换一份</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <!-- messages inserted here -->
  </div>

  <!-- Bottom bar -->
  <div class="chat-bottom">

    <!-- 基础解读 chips -->
    <div class="chip-group">
      <div class="chip-group-label">基础解读</div>
      <div class="chip-row">
        <button class="chip" onclick="selectReport('基础版个人报告')">📊 基础版个人</button>
        <button class="chip" onclick="selectReport('亲子合盘报告')">👨‍👩‍👧 亲子合盘</button>
        <button class="chip" onclick="selectReport('亲密关系合盘（未婚）')">💑 亲密关系·未婚</button>
        <button class="chip" onclick="selectReport('亲密关系合盘（已婚）')">💍 亲密关系·已婚</button>
      </div>
    </div>

    <!-- 定制版 chips -->
    <div class="chip-group">
      <div class="chip-group-label">定制版报告</div>
      <div class="chip-row">
        <button class="chip custom" onclick="selectReport('职业规划个性化报告')">💼 职业规划</button>
        <button class="chip custom" onclick="selectReport('学习能力提升个性化报告')">🧠 学习能力提升</button>
        <button class="chip custom" onclick="selectReport('全阶段学业规划个性化报告')">📚 全阶段学业规划</button>
        <button class="chip custom" onclick="selectReport('高考志愿报读个性化报告')">🎓 高考志愿报读</button>
        <button class="chip custom" onclick="selectReport('兴趣班选择个性化报告')">🎨 兴趣班选择</button>
        <button class="chip custom" onclick="selectReport('身心健康个性化报告')">🧘 身心健康</button>
      </div>
    </div>

    <!-- Text input -->
    <div class="input-row">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="或直接输入你的问题…"
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
let imageBase64   = null;
let imageMimeType = 'image/jpeg';
let sessionId     = 'report_' + Date.now();
let history       = [];
let imageUsed     = false;

// ── DOM ─────────────────────────────────────────────────────────────────────
const preUpload    = document.getElementById('preUpload');
const uploadZone   = document.getElementById('uploadZone');
const fileInput    = document.getElementById('fileInput');
const errorBar     = document.getElementById('errorBar');
const chatPage     = document.getElementById('chatPage');
const reportThumb  = document.getElementById('reportThumb');
const reportName   = document.getElementById('reportName');
const reuploadBtn  = document.getElementById('reuploadBtn');
const chatMessages = document.getElementById('chatMessages');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');

// ── File Handling ────────────────────────────────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});
reuploadBtn.addEventListener('click', resetToUpload);

function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showError('请上传图片文件（JPG、PNG、截图等）。PDF请先截图后上传。');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    showError('图片太大（上限10MB），请压缩后再试。');
    return;
  }
  hideError();
  imageMimeType = file.type || 'image/jpeg';

  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    imageBase64 = dataUrl.split(',')[1];

    // Setup chat page header
    reportThumb.src = dataUrl;
    const n = file.name;
    reportName.textContent = n.length > 24 ? n.slice(0, 22) + '…' : n;

    // Switch to chat
    preUpload.classList.add('hidden');
    chatPage.classList.add('active');

    // Show AI welcome
    appendAI('您好！我已收到这份测评报告 📋\n\n请从下方选择解读方向——\n• 基础解读：读懂报告中的天赋数据\n• 定制版报告：针对具体人生场景生成专属内容\n\n也可以直接在对话框提问。');
    sendBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function resetToUpload() {
  imageBase64 = null;
  imageUsed = false;
  history = [];
  sessionId = 'report_' + Date.now();
  fileInput.value = '';
  chatMessages.innerHTML = '';
  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendBtn.disabled = true;
  chatPage.classList.remove('active');
  preUpload.classList.remove('hidden');
}

// ── Report Type Chip Selection ───────────────────────────────────────────────
function selectReport(type) {
  if (!imageBase64) return;
  // Display text shown in chat bubble
  const display = '我想要：' + type;
  // Actual content sent to API includes instruction
  const content = `请根据上传的测评报告，为我生成【${type}】。请结合报告数据和知识库，输出完整、个性化的${type}内容。`;
  sendMessage(content, display);
}

// ── Message Display ──────────────────────────────────────────────────────────
function appendAI(text) {
  // Remove any pending typing indicator
  const t = document.getElementById('typingNow');
  if (t) t.remove();

  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="msg-avatar">✨</div>
    <div class="msg-bubble">${esc(text)}</div>`;
  chatMessages.appendChild(div);
  scrollToBottom();
}

function appendUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-bubble">${esc(text)}</div>`;
  chatMessages.appendChild(div);
  scrollToBottom();
}

function showTyping() {
  const t = document.createElement('div');
  t.id = 'typingNow';
  t.className = 'typing show';
  t.innerHTML = `
    <div class="msg-avatar">✨</div>
    <div class="typing-inner">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  chatMessages.appendChild(t);
  scrollToBottom();
}

function hideTyping() {
  const t = document.getElementById('typingNow');
  if (t) t.remove();
}

function scrollToBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function esc(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

// ── Input ────────────────────────────────────────────────────────────────────
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
  sendBtn.disabled = !chatInput.value.trim() || !imageBase64;
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (chatInput.value.trim()) sendMessage(chatInput.value.trim());
  }
});

sendBtn.addEventListener('click', () => {
  if (chatInput.value.trim()) sendMessage(chatInput.value.trim());
});

// ── API Call ─────────────────────────────────────────────────────────────────
async function sendMessage(content, displayText) {
  if (!imageBase64) return;

  const display = displayText || content;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendBtn.disabled = true;

  appendUser(display);
  history.push({ role: 'user', content });
  showTyping();

  try {
    const body = {
      context:  'report',
      content,
      sessionId,
      history:  history.slice(-8),
    };

    // Send image only on the first API call
    if (!imageUsed && imageBase64) {
      body.imageBase64   = imageBase64;
      body.imageMimeType = imageMimeType;
      imageUsed = true;
    }

    const res = await fetch('/api/guest-chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });

    if (!res.ok) throw new Error('服务器错误 ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const reply = data.reply || '请稍后再试。';
    hideTyping();
    appendAI(reply);
    history.push({ role: 'assistant', content: reply });

  } catch (err) {
    hideTyping();
    appendAI('出了点问题，请稍后再试。（' + (err.message || '网络错误') + '）');
  }

  // Re-enable input
  sendBtn.disabled = !chatInput.value.trim();
}

// ── Errors ───────────────────────────────────────────────────────────────────
function showError(msg) {
  errorBar.textContent = msg;
  errorBar.classList.add('visible');
}
function hideError() {
  errorBar.classList.remove('visible');
}
</script>
</body>
</html>
