<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIPIWEN 指导师工作台</title>
  <meta name="description" content="AIPIWEN 指导师工作台正式账号入口">
  <link rel="stylesheet" href="static/ai-interpreter.css">
  <script src="static/v3a-auth.js" defer></script>
</head>
<body data-v3a-auth-page="workbench" hidden>
  <div class="app-shell workbench-shell">
    <main class="main">
      <header class="topbar workbench-topbar">
        <a class="brand workbench-brand" href="ai-interpreter-workbench.html" aria-label="AIPIWEN 指导师工作台">
          <svg class="brand-flower" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle class="brand-flower-ring" cx="18" cy="18" r="15.5" stroke-width=".9" stroke-dasharray="2.5 6"/>
            <g class="brand-flower-petals">
              <ellipse cx="18" cy="12" rx="2.2" ry="6.5" transform="rotate(0 18 18)"/>
              <ellipse cx="18" cy="12" rx="2.2" ry="6.5" transform="rotate(90 18 18)"/>
              <ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(45 18 18)"/>
              <ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(135 18 18)"/>
            </g>
            <circle class="brand-flower-center" cx="18" cy="18" r="3"/>
          </svg>
          <div>
            <p class="brand-title">AIPIWEN 指导师工作台</p>
            <div class="brand-subtitle">工作入口</div>
          </div>
        </a>
        <div class="workbench-account-strip" aria-label="当前账号">
          <div>
            <span>身份</span>
            <strong id="v3a-workbench-role">已激活</strong>
          </div>
          <div>
            <span>积分</span>
            <strong id="v3a-workbench-balance">待同步</strong>
          </div>
          <div>
            <span>邀请码</span>
            <strong id="v3a-workbench-invite-code">待生成</strong>
          </div>
          <button class="btn ghost" id="v3a-workbench-logout" type="button">退出登录</button>
        </div>
      </header>

      <p class="dryrun-error" id="v3a-workbench-message" role="status" aria-live="polite" hidden></p>

      <section class="workbench-entry-grid" aria-label="工作入口">
        <a class="workbench-entry primary-entry" href="#" aria-disabled="true">
          <span>AI</span>
          <div>
            <h2>AI 解读助手</h2>
            <p>进入 8 步标准解读流程，生成表达建议、提问提示和边界提醒。</p>
          </div>
          <em>准备接入</em>
        </a>
        <a class="workbench-entry" href="#" aria-disabled="true">
          <span>R</span>
          <div>
            <h2>报告接入</h2>
            <p>绑定客户报告、确认授权来源，并进入可追溯的解读记录。</p>
          </div>
          <em>待开放</em>
        </a>
        <a class="workbench-entry" href="#" aria-disabled="true">
          <span>C</span>
          <div>
            <h2>客户管理</h2>
            <p>管理客户归属、服务进度、跟进记录和后续复盘提醒。</p>
          </div>
          <em>待开放</em>
        </a>
        <a class="workbench-entry" href="#" aria-disabled="true">
          <span>T</span>
          <div>
            <h2>训练案例</h2>
            <p>练习安全表达、案例复核和标准话术，沉淀自己的服务能力。</p>
          </div>
          <em>待开放</em>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
