<html lang="zh-CN">
<head>

<style>
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --amber-glow: rgba(194,105,42,.12);
  --ok:         #3A7D5E;
  --font-serif: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-sans:  -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body { font-family: var(--font-sans); background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* NAV */
.top-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-10);
  background: rgba(253,252,248,.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 10;
}
.nav-back { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--ink-40); cursor: pointer; text-decoration: none; }
.nav-back svg { width: 18px; height: 18px; }
.nav-wordmark { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }

/* LOADING */
#screen-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100vh - 57px); padding: 40px 24px;
  text-align: center;
}
.loading-orb {
  width: 64px; height: 64px; border-radius: 50%;
  background: conic-gradient(var(--amber) 0deg, var(--amber-soft) 360deg);
  animation: spin 1.1s linear infinite;
  margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-family: var(--font-serif); font-size: 22px; color: var(--ink); font-weight: normal; margin-bottom: 10px; }
.loading-sub { font-size: 14px; color: var(--ink-40); line-height: 1.7; }
.loading-steps { margin-top: 24px; text-align: left; }
.loading-step {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--ink-40); padding: 6px 0;
  opacity: 0; animation: fadeStep .5s ease forwards;
}
.loading-step.done { color: var(--ok); }
.loading-step .step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-10); flex-shrink: 0;
}
.loading-step.done .step-dot { background: var(--ok); }
@keyframes fadeStep { from { opacity:0; transform: translateX(-8px); } to { opacity:1; transform: none; } }

/* REPORT */
#screen-report { display: none; }
.page-wrap { max-width: 520px; margin: 0 auto; padding: 32px 24px 80px; }

.report-header {
  text-align: center; padding: 28px 0 24px;
  border-bottom: 1px solid var(--ink-10); margin-bottom: 28px;
}
.report-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber-soft); border-radius: 20px; padding: 5px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 14px;
}
.report-title {
  font-family: var(--font-serif); font-size: 26px; line-height: 1.3;
  color: var(--ink); font-weight: normal; margin-bottom: 8px;
}
.report-title em { font-style: italic; color: var(--amber); }
.report-behavior-quote {
  font-size: 13px; color: var(--ink-40); font-style: italic;
  padding: 10px 16px; background: var(--cream-deep); border-radius: 10px;
  margin-top: 10px; line-height: 1.6;
}
.report-behavior-quote::before { content: '"'; }
.report-behavior-quote::after  { content: '"'; }

/* INSIGHT SECTIONS */
.insight-section {
  background: white; border: 1px solid var(--ink-10);
  border-radius: 16px; padding: 22px 20px; margin-bottom: 16px;
}
.insight-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 10px;
}
.insight-heading {
  font-family: var(--font-serif); font-size: 18px;
  color: var(--ink); font-weight: normal; margin-bottom: 10px;
}
.insight-body { font-size: 14px; line-height: 1.8; color: var(--ink-70); }

/* TYPE BADGE */
.type-badge-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.type-badge {
  padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
}
.type-badge.active { background: var(--amber); color: white; }
.type-badge.inactive { background: var(--ink-10); color: var(--ink-40); }

/* SUMMARY CARD */
.summary-card {
  background: var(--amber); border-radius: 16px;
  padding: 22px 20px; margin-bottom: 28px; color: white;
}
.summary-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; opacity: .7; margin-bottom: 10px;
}
.summary-text {
  font-family: var(--font-serif); font-size: 20px;
  line-height: 1.45; font-weight: normal;
}

/* CTA */
.cta-section { margin-top: 8px; }
.cta-main {
  display: block; width: 100%; padding: 18px 24px;
  background: var(--ink); color: white;
  border: none; border-radius: 16px;
  font-family: var(--font-sans); font-size: 17px; font-weight: 700;
  cursor: pointer; text-align: center; text-decoration: none;
  box-shadow: 0 6px 20px rgba(26,23,20,.25);
  transition: transform .18s, box-shadow .18s;
}
.cta-main:active { transform: scale(.97); }
.cta-note { text-align: center; font-size: 12px; color: var(--ink-40); margin-top: 10px; line-height: 1.6; }
</style>
<script src="/js/error-tracker.js"></script>
</head>
<body>

<nav class="top-nav">
  <a class="nav-back" href="child-chat.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    返回
  </a>
  <div class="nav-wordmark">AIPIWEN</div>
  <div style="width:40px"></div>
</nav>

<!-- LOADING -->
<div id="screen-loading">
  <div class="loading-orb"></div>
  <div class="loading-title">AI 正在理解孩子的行为…</div>
  <div class="loading-sub">这不是翻译，是换一种视角看见孩子</div>
  <div class="loading-steps" id="loading-steps"></div>
</div>

<!-- REPORT -->
<div id="screen-report">
  <div class="page-wrap">

    <div class="report-header">
      <div class="report-badge">AI 轻报告</div>
      <h1 class="report-title" id="report-title">行为 = <em>内在需求表达</em></h1>
      <div class="report-behavior-quote" id="behavior-quote"></div>
    </div>

    <!-- 行为解释 -->
    <div class="insight-section">
      <div class="insight-eyebrow">行为解释</div>
      <h2 class="insight-heading" id="insight-heading-1"></h2>
      <p class="insight-body" id="insight-body-1"></p>
    </div>

    <!-- 初步分类 -->
    <div class="insight-section">
      <div class="insight-eyebrow">行为模式识别</div>
      <div class="type-badge-wrap" id="type-badges"></div>
      <p class="insight-body" style="margin-top:12px" id="type-desc"></p>
    </div>

    <!-- 历史感知提示（回访用户显示）-->
    <div id="history-note-card" style="display:none;
      background: var(--amber-soft); border: 1px solid rgba(194,105,42,.25);
      border-radius: 14px; padding: 14px 18px; margin-bottom: 4px;
      font-size: 13px; color: var(--amber); line-height: 1.7;"></div>

    <!-- V2：为什么会这样（Why Layer 卡片）-->
    <div id="why-card" style="display:none; background: white; border: 1px solid var(--ink-10); border-radius: 16px; padding: 22px 20px; margin-bottom: 16px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px;">为什么会这样</div>
      <div style="font-family: var(--font-serif); font-size: 17px; color: var(--ink); margin-bottom: 12px;" id="why-main-reason"></div>
      <div id="why-chain" style="font-size: 13px; color: var(--ink-40); line-height: 1.7; padding: 10px 14px; background: var(--cream-deep); border-radius: 10px; margin-bottom: 10px;"></div>
      <div id="why-second-reason" style="font-size: 13px; color: var(--ink-70); line-height: 1.75; display:none;"></div>
    </div>

    <!-- V2：趋势提示（多次用户显示）-->
    <div id="trend-card" style="display:none; background: var(--amber-soft); border: 1px solid rgba(194,105,42,.25); border-radius: 14px; padding: 14px 18px; margin-bottom: 4px; font-size: 13px; color: var(--amber); line-height: 1.7;"></div>

    <!-- 一句话总结 -->
    <div class="summary-card">
      <div class="summary-eyebrow">AI 洞察</div>
      <div class="summary-text" id="summary-text"></div>
    </div>

    <!-- CTA -->
    <div class="cta-section">
      <a class="cta-main" id="cta-link" href="#">👉 查看完整AI行为分析报告</a>
      <div class="cta-note">完整报告包含行为结构分析、家长误区和三条可执行建议</div>
    </div>

    <!-- 分享二维码 + 转发语 -->
    <div id="share-qr-section" style="display:none;margin-top:24px;padding:20px;background:var(--ink);border-radius:16px;">
      <div style="text-align:center;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,252,248,.4);margin-bottom:14px;">分享给朋友</div>
        <div id="share-qr-wrap" style="display:inline-block;background:white;border-radius:10px;padding:8px;margin-bottom:12px;"></div>
        <div style="font-size:13px;color:rgba(253,252,248,.7);line-height:1.6;">扫码免费读懂孩子的行为<br><span style="font-size:11px;color:rgba(253,252,248,.35);">AIPIWEN · AI行为理解 · 免费</span></div>
      </div>
      <div style="height:1px;background:rgba(255,255,255,.07);margin:16px 0;"></div>
      <!-- 转发语选择器（share-utils.js 注入） -->
      <div id="light-caption-area"></div>
    </div>

  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/share-utils.js"></script>
<script src="js/aipiwen-core.js"></script>
<script>
const STORAGE_KEY = 'aipiwen_behavior_input';

// ── 加载动画 ───────────────────────────────────────
const STEPS = [
  '读取孩子行为描述…',
  '识别行为背后的需求信号…',
  '比对心理模式数据库…',
  '生成个性化理解报告…'
];

function runLoading(callback) {
  const container = document.getElementById('loading-steps');
  let i = 0;
  function addStep() {
    if (i >= STEPS.length) { setTimeout(callback, 400); return; }
    const el = document.createElement('div');
    el.className = 'loading-step';
    el.style.animationDelay = (i * 0.1) + 's';
    el.innerHTML = `<div class="step-dot"></div>${STEPS[i]}`;
    container.appendChild(el);
    setTimeout(() => { el.classList.add('done'); }, 300);
    i++;
    setTimeout(addStep, 650);
  }
  addStep();
}

// ── 渲染报告 ───────────────────────────────────────
function showReport(behavior, reportId, userId) {
  let history = [], analysis = null, content = null;

  try {
    history  = AIPIWEN.MemorySystem.getRecent(userId, 5);
    analysis = AIPIWEN.AnalysisEngine.analyze(behavior, history);
    content  = AIPIWEN.ContentLibrary.lightReport(analysis);
  } catch(e) {
    console.error('[AIPIWEN] 分析引擎错误:', e);
    // 回退：直接显示基础报告界面
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-report').style.display  = 'block';
    document.getElementById('behavior-quote').textContent = behavior;
    document.getElementById('insight-heading-1').textContent = '孩子的行为背后有他自己的逻辑';
    document.getElementById('insight-body-1').textContent = '每个行为都是孩子在表达某种需求——AI 分析需要稍后再试。';
    document.getElementById('summary-text').textContent = '请稍后刷新重试，或从首页重新描述行为。';
    document.getElementById('cta-link').href = 'child-chat.html';
    return;
  }

  // 写入 Lead + 记忆（静默失败不阻断报告显示）
  try { AIPIWEN.LeadSystem.create(userId, reportId, analysis, behavior); } catch(e) {}
  try {
    AIPIWEN.MemorySystem.add(userId, {
      input: behavior,
      analysis: { primary: analysis.primary, secondary: analysis.secondary, legacyType: analysis.legacyType },
      tags: analysis.tags,
      report_id: reportId
    });
  } catch(e) {}

  // 填充 DOM
  document.getElementById('behavior-quote').textContent      = behavior;
  document.getElementById('insight-heading-1').textContent   = content.heading;
  document.getElementById('insight-body-1').textContent      = content.body;
  document.getElementById('summary-text').textContent        = content.insight;

  // 行为模式徽章（新12类系统：主要 + 次要）
  const badgeWrap = document.getElementById('type-badges');
  badgeWrap.innerHTML = '';
  const primaryMeta = AIPIWEN.AnalysisEngine.PATTERNS[analysis.primary];
  if (primaryMeta) {
    const b1 = document.createElement('div');
    b1.className = 'type-badge active';
    b1.textContent = primaryMeta.label;
    badgeWrap.appendChild(b1);
  }
  if (analysis.secondary) {
    const secMeta = AIPIWEN.AnalysisEngine.PATTERNS[analysis.secondary];
    if (secMeta) {
      const b2 = document.createElement('div');
      b2.className = 'type-badge inactive';
      b2.textContent = secMeta.label;
      badgeWrap.appendChild(b2);
    }
  }
  document.getElementById('type-desc').textContent =
    `AI 识别：这个行为模式主要属于「${content.label}」。完整报告包含行为结构分析、家长常见误区和三条可执行建议。`;

  // 历史感知提示
  if (content.historyNote) {
    const noteEl = document.getElementById('history-note-card');
    noteEl.textContent = content.historyNote;
    noteEl.style.display = 'block';
  }

  // V2：Why Layer 卡片
  if (content.whyParagraph) {
    const wp = content.whyParagraph;
    document.getElementById('why-main-reason').textContent = wp.mainReason;
    document.getElementById('why-chain').textContent = '触发链：' + wp.chainText;
    if (wp.secondReason) {
      const el = document.getElementById('why-second-reason');
      el.textContent = '还有一个常见原因：' + wp.secondReason;
      el.style.display = 'block';
    }
    document.getElementById('why-card').style.display = 'block';
  }

  // V2：趋势卡片（多次用户）
  try {
    const trendResult = AIPIWEN.TrendAnalyzer.analyze(userId);
    if (trendResult && trendResult.trendText && trendResult.totalSessions >= 2) {
      const trendEl = document.getElementById('trend-card');
      trendEl.textContent = trendResult.trendText;
      trendEl.style.display = 'block';
    }
  } catch(e) {}

  // CTA 链接
  document.getElementById('cta-link').href = 'full-report.html?id=' + encodeURIComponent(reportId);

  // 分享二维码 + 转发语
  try {
    const qrWrap = document.getElementById('share-qr-wrap');
    const qrSection = document.getElementById('share-qr-section');
    if (qrWrap && typeof QRCode !== 'undefined') {
      const shareUrl = 'https://aipiwen.cn/child-chat.html?utm_source=light-report&utm_medium=qr&utm_campaign=share';
      new QRCode(qrWrap, { text: shareUrl, width: 100, height: 100, colorDark: '#1A1714', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.L });
      qrSection.style.display = 'block';
      // 注入行为理解推荐转发语（获客场景，深色主题）
      const capArea = document.getElementById('light-caption-area');
      if (capArea && window.SHARE) {
        SHARE.renderCaptionPicker(capArea, 'child', '', '');
      }
    }
  } catch(e) {}

  // 切换屏幕
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-report').style.display  = 'block';
}

// ── 初始化 ─────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  let behavior = '';
  let userId = 'u_anon';
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    behavior = stored.behavior || '';
    userId   = stored.user_id  || AIPIWEN.UserSystem.getOrCreate().user_id;
  } catch(e) {}

  if (!behavior) {
    window.location.href = 'child-chat.html';
    return;
  }

  // 防御：AIPIWEN 加载失败时回退到输入页
  if (typeof AIPIWEN === 'undefined' || typeof AIPIWEN.generateReportId !== 'function') {
    window.location.href = 'child-chat.html';
    return;
  }

  let reportId;
  try { reportId = AIPIWEN.generateReportId(); }
  catch(e) { window.location.href = 'child-chat.html'; return; }

  runLoading(function() {
    try {
      showReport(behavior, reportId, userId);
    } catch(e) {
      console.error('showReport error:', e);
      document.getElementById('screen-loading').style.display = 'none';
      document.getElementById('screen-report').style.display = 'block';
    }
  });
});
</script>
</body>
</html>
