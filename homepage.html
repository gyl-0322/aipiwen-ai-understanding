<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIPIWEN · 让父母真正读懂孩子</title>
<style>
/* ─────────────────────────────────────
   DESIGN TOKENS — 与行为理解App完全一致
───────────────────────────────────── */
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --amber-glow: rgba(194,105,42,.10);
  --dark:       #1A1714;
  --ok:         #3A7D5E;
  --r-sm:  10px;
  --r-md:  16px;
  --r-lg:  24px;
  --r-xl:  32px;
  --font-serif: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-sans:  -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ─────────────────────────────────────
   LOGO ANIMATION
───────────────────────────────────── */
@keyframes logo-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes logo-spin-rev {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
@keyframes logo-breathe {
  0%,100% { opacity: .82; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.04); }
}
.logo-ring-outer {
  transform-origin: 18px 18px;
  animation: logo-spin 22s linear infinite;
}
.logo-petals {
  transform-origin: 18px 18px;
  animation: logo-spin-rev 14s linear infinite;
}
.logo-center {
  transform-origin: 18px 18px;
  animation: logo-breathe 3.5s ease-in-out infinite;
}

/* ─────────────────────────────────────
   SITE HEADER
───────────────────────────────────── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 16px;
  position: sticky;
  top: 0;
  background: rgba(253,252,248,.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
  border-bottom: 1px solid var(--ink-10);
}
/* Logo 左侧：图标 + 文字 */
.logo-lockup {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
}
.logo-svg {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}
.wordmark {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1;
}
.wm-e { color: var(--amber); }

/* 右侧：沐海星辰 实心印章 */
.brand-seal {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 50px;
  height: 50px;
  background: var(--amber);
  border-radius: 5px;
  padding: 5px;
  gap: 0;
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 3px 12px rgba(194,105,42,.40), 0 1px 4px rgba(194,105,42,.20);
}
.brand-seal::after {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1.2px solid rgba(255,255,255,.55);
  border-radius: 2px;
  pointer-events: none;
}
.brand-seal span {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0;
}

/* ─────────────────────────────────────
   HERO
───────────────────────────────────── */
.hero {
  padding: 56px 28px 48px;
  max-width: 520px;
  margin: 0 auto;
}
.hero-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 16px;
}
.hero-title {
  font-family: var(--font-serif);
  font-size: 36px;
  line-height: 1.22;
  letter-spacing: -.5px;
  color: var(--ink);
  font-weight: normal;
  margin-bottom: 18px;
}
.hero-title em {
  font-style: italic;
  color: var(--amber);
}
.hero-body {
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink-70);
  max-width: 380px;
}

/* ─────────────────────────────────────
   DIVIDER
───────────────────────────────────── */
.section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 28px;
  max-width: 520px;
  margin: 0 auto 28px;
}
.section-divider::before,
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--ink-10);
}
.section-divider-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-20);
  white-space: nowrap;
}

/* ─────────────────────────────────────
   PRODUCT CARDS
───────────────────────────────────── */
.products {
  padding: 0 20px 48px;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.product-card {
  background: #FFFEFB;
  border: 1px solid var(--ink-10);
  border-radius: var(--r-lg);
  padding: 28px 24px;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
  position: relative;
  overflow: hidden;
}
.product-card:active {
  transform: scale(.985);
}
.product-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--amber);
  opacity: 0;
  transition: opacity .2s;
}
.product-card:hover::before {
  opacity: 1;
}
.product-card-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--amber-soft);
  border-radius: 20px;
  padding: 4px 12px;
  margin-bottom: 18px;
}
.product-card-badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
}
.product-card-badge-text {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--amber);
}
.product-card-title {
  font-family: var(--font-serif);
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -.3px;
  color: var(--ink);
  font-weight: normal;
  margin-bottom: 10px;
}
.product-card-desc {
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink-70);
  margin-bottom: 22px;
}
.product-card-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.product-pill {
  background: var(--cream-deep);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--ink-70);
}
.product-card-cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.product-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--dark);
  color: #FAF9F6;
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .02em;
  transition: background .15s;
}
.product-cta-btn:active { background: #3A3530; }
.product-cta-btn svg { width: 16px; height: 16px; }
.product-cta-status {
  font-size: 12px;
  color: var(--ok);
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
}
.product-cta-status::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  display: block;
}

/* 将来产品占位卡 */
.product-card.coming-soon {
  border-style: dashed;
  border-color: var(--ink-10);
  background: var(--cream);
  opacity: .6;
}
.product-card.coming-soon .product-cta-btn {
  background: var(--ink-10);
  color: var(--ink-40);
}

/* ─────────────────────────────────────
   ABOUT STRIP
───────────────────────────────────── */
.about-strip {
  background: var(--dark);
  margin: 0;
  padding: 40px 28px;
}
.about-inner {
  max-width: 520px;
  margin: 0 auto;
}
.about-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 14px;
}
.about-text {
  font-family: var(--font-serif);
  font-size: 20px;
  line-height: 1.6;
  color: #EAE7E0;
  font-weight: normal;
}
.about-text em { font-style: italic; color: var(--amber); }

/* ─────────────────────────────────────
   HERO CTA BUTTON
───────────────────────────────────── */
.hero-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 32px;
  padding: 18px 32px;
  background: var(--amber);
  color: #fff;
  border-radius: var(--r-lg);
  font-size: 18px;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: .02em;
  box-shadow: 0 6px 24px rgba(194,105,42,.38);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease);
}
.hero-cta-btn:active {
  transform: scale(.96);
  box-shadow: 0 3px 10px rgba(194,105,42,.28);
}
.hero-trust {
  margin-top: 16px;
  font-size: 13px;
  color: var(--ink-40);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hero-trust::before { content: '✓'; color: var(--amber); font-weight: 700; }

/* ─────────────────────────────────────
   FOOTER
───────────────────────────────────── */
.site-footer {
  padding: 28px 28px calc(28px + env(safe-area-inset-bottom));
  max-width: 520px;
  margin: 0 auto;
  text-align: center;
}
.footer-logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-40);
  margin-bottom: 8px;
}
.footer-icp {
  font-size: 12px;
  color: var(--ink-20);
  margin-bottom: 6px;
}
.footer-icp a {
  color: var(--ink-20);
  text-decoration: none;
}
.footer-copy {
  font-size: 12px;
  color: var(--ink-20);
}
</style>
</head>
<body>

</html>
