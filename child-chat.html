<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --ok:         #3A7D5E;
  --font-serif: Georgia,'Noto Serif SC','Source Han Serif SC',serif;
  --font-sans:  -apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:var(--font-sans);
  background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column;
}
/* 聊天模式：锁定高度，让内部chat-scroll滚动 */
body.chat-mode { height:100vh; overflow:hidden; }

/* ── NAV ── */
.top-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--ink-10);
  background:rgba(253,252,248,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:10; flex-shrink:0;
}
.nav-back {
  display:flex; align-items:center; gap:5px;
  font-size:14px; color:var(--ink-40); cursor:pointer;
  text-decoration:none; border:none; background:none;
}
.nav-back svg { width:18px; height:18px; }
.nav-wordmark { font-size:13px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); }

/* ── PHASE 1: FORM ── */
#phase-form {
  flex:1; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.page-wrap { max-width:520px; margin:0 auto; padding:40px 24px 80px; }
.page-eyebrow { font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:14px; }
.page-title { font-family:var(--font-serif); font-size:28px; line-height:1.3; letter-spacing:-.3px; color:var(--ink); font-weight:normal; margin-bottom:12px; }
.page-title em { font-style:italic; color:var(--amber); }
.page-sub { font-size:15px; line-height:1.75; color:var(--ink-70); margin-bottom:32px; }

.input-card {
  background:white; border:1.5px solid var(--ink-10);
  border-radius:18px; padding:20px; margin-bottom:20px;
  transition:border-color .2s;
}
.input-card:focus-within { border-color:var(--amber); }
.input-label { font-size:13px; font-weight:600; color:var(--ink-70); margin-bottom:10px; }
.input-textarea {
  width:100%; min-height:110px;
  font-family:var(--font-sans); font-size:16px; line-height:1.7; color:var(--ink);
  border:none; outline:none; resize:none; background:transparent; padding:0;
}
.input-textarea::placeholder { color:var(--ink-20); }
.input-counter { text-align:right; font-size:11px; color:var(--ink-20); margin-top:8px; }

.examples-label { font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--ink-40); text-transform:uppercase; margin-bottom:10px; }
.age-chip {
  padding:5px 2px; background:rgba(194,105,42,.07); border:1px solid rgba(194,105,42,.38);
  border-radius:20px; font-size:10.5px; color:var(--amber-dark); cursor:pointer;
  transition:background .15s, border-color .15s; text-align:center; white-space:nowrap;
}
.age-chip.selected { background:var(--amber); border-color:var(--amber); color:white; font-weight:600; }

.example-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
.example-chip {
  padding:7px 14px; background:rgba(194,105,42,.07); border:1px solid rgba(194,105,42,.38);
  border-radius:20px; font-size:13px; color:var(--amber-dark); cursor:pointer;
  transition:background .15s, border-color .15s;
}
.example-chip:active,
.example-chip:hover   { background:rgba(194,105,42,.14); border-color:var(--amber); }
.example-chip.selected { background:var(--amber); border-color:var(--amber); color:white; font-weight:600; }

.cta-btn {
  display:block; width:100%; padding:18px 24px;
  background:var(--amber); color:white; border:none; border-radius:16px;
  font-family:var(--font-sans); font-size:17px; font-weight:700;
  cursor:pointer; text-align:center;
  box-shadow:0 6px 20px rgba(194,105,42,.35);
  transition:transform .18s, box-shadow .18s;
}
.cta-btn:active   { transform:scale(.97); box-shadow:0 3px 10px rgba(194,105,42,.25); }
.cta-btn:disabled { background:var(--ink-10); color:var(--ink-40); box-shadow:none; cursor:not-allowed; }
.cta-note { text-align:center; font-size:12px; color:var(--ink-40); margin-top:12px; line-height:1.6; }
.privacy-bar { margin-top:36px; padding-top:24px; border-top:1px solid var(--ink-10); font-size:12px; color:var(--ink-40); line-height:1.7; text-align:center; }

/* ── 分享按钮 ── */
.share-btn {
  display:flex; align-items:center; gap:6px; margin:16px auto 0;
  padding:10px 18px; background:transparent;
  border:1px solid rgba(194,105,42,.4); border-radius:20px;
  font-size:13px; color:var(--amber); cursor:pointer;
  transition:background .15s;
}
.share-btn:active { background:rgba(194,105,42,.08); }

/* ── 分享弹层 ── */
#share-overlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.9);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:28px 16px 56px;
}
#share-overlay.show { display:block; }
#share-scroll-wrap {
  max-width:400px; margin:0 auto;
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
#share-img-area img { max-width:100%; border-radius:18px; display:block; }
#share-img-hint { display:none; font-size:12px; color:rgba(255,255,255,.4); text-align:center; }
#share-caption-area { width:100%; }
#share-close-btn {
  padding:10px 36px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  border-radius:20px; color:rgba(255,255,255,.5); font-size:14px; cursor:pointer;
}

/* ── 离屏渲染区（html2canvas 用，不可见） ── */
#share-render-zone { position:absolute; left:-9999px; top:0; z-index:0; width:360px; pointer-events:none; opacity:0; }

/* ── PHASE 1.5: LOADING ── */
#phase-loading {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; padding: 40px 24px; text-align: center;
}
.loading-orb {
  width: 64px; height: 64px; border-radius: 50%;
  background: conic-gradient(var(--amber) 0deg, var(--amber-soft) 360deg);
  animation: orbSpin 1.1s linear infinite;
  margin-bottom: 24px;
}
@keyframes orbSpin { to { transform: rotate(360deg); } }
.loading-title {
  font-family: var(--font-serif); font-size: 22px;
  color: var(--ink); font-weight: normal; margin-bottom: 10px;
}
.loading-sub { font-size: 14px; color: var(--ink-40); line-height: 1.7; }
.loading-steps { margin-top: 24px; text-align: left; }
.loading-step {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--ink-40); padding: 6px 0;
  opacity: 0; animation: fadeStep .5s ease forwards;
}
.loading-step.done { color: var(--ok); }
.loading-step .step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-10); flex-shrink: 0;
}
.loading-step.done .step-dot { background: var(--ok); }
@keyframes fadeStep { from { opacity:0; transform: translateX(-8px); } to { opacity:1; transform: none; } }

/* ── PHASE 2: CHAT ── */
#phase-chat { flex:1; display:none; flex-direction:column; overflow:hidden; }

.chat-scroll {
  flex:1; overflow-y:auto;
  padding:20px 16px 12px;
  display:flex; flex-direction:column; gap:14px;
  -webkit-overflow-scrolling:touch;
  max-width:600px; width:100%; margin:0 auto;
}
.chat-scroll::-webkit-scrollbar { width:3px; }
.chat-scroll::-webkit-scrollbar-thumb { background:var(--ink-10); border-radius:2px; }

/* 重新描述 */
.reset-bar {
  max-width:600px; width:100%; margin:0 auto;
  padding:10px 16px 0;
}
.reset-btn {
  font-size:12px; color:var(--ink-40); background:none; border:none;
  cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:4px;
}
.reset-btn:hover { color:var(--amber); }

/* Bubbles */
.bubble-row { display:flex; gap:10px; align-items:flex-end; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row.ai   { justify-content:flex-start; }
.ai-avatar {
  width:30px; height:30px; background:var(--ink); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--amber); flex-shrink:0;
}
.bubble {
  max-width:78%; padding:12px 16px;
  font-size:14px; line-height:1.72; word-break:break-word;
}
.bubble.user { background:var(--amber); color:white; border-radius:18px 18px 4px 18px; }
.bubble.ai   { background:white; border:1px solid var(--ink-10); border-radius:18px 18px 18px 4px; color:var(--ink-70); box-shadow:0 1px 6px rgba(0,0,0,.05); }

/* Analysis card */
.card-row { display:flex; gap:10px; align-items:flex-start; }
.analysis-card {
  max-width:82%;
  background:linear-gradient(135deg,#1A1714 0%,#2E2520 100%);
  border-radius:18px 18px 18px 4px; padding:22px 20px 18px;
  position:relative; overflow:hidden;
}
.card-orb { position:absolute; border-radius:50%; background:var(--amber); pointer-events:none; }
.card-orb-1 { width:140px; height:140px; top:-55px; right:-40px; opacity:.09; }
.card-orb-2 { width:100px; height:100px; bottom:-35px; left:-30px; opacity:.07; }
.card-eye   { font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-bottom:12px; position:relative; }
.card-insight { font-family:var(--font-serif); font-size:15px; line-height:1.65; color:white; margin-bottom:16px; position:relative; }
.card-divider { height:1px; background:rgba(255,255,255,.1); margin-bottom:12px; }
.card-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; position:relative; }
.card-id  { font-size:10px; color:rgba(255,255,255,.25); font-family:monospace; }
.card-tag { font-size:10px; font-weight:700; background:var(--amber); color:white; border-radius:5px; padding:3px 9px; }
.card-actions { display:flex; gap:8px; position:relative; }
.card-btn {
  flex:1; padding:9px 8px; border-radius:10px; font-size:12px; font-weight:600;
  border:none; cursor:pointer; text-align:center; transition:opacity .15s;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.card-btn:active { opacity:.75; }
.card-btn.primary { background:var(--amber); color:white; }
.card-btn.ghost   { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }

/* Thinking */
.thinking-dots {
  display:flex; gap:5px; padding:14px 18px;
  background:white; border:1px solid var(--ink-10);
  border-radius:18px 18px 18px 4px; box-shadow:0 1px 6px rgba(0,0,0,.05);
}
.dot { width:6px; height:6px; background:rgba(26,23,20,.25); border-radius:50%; animation:dotB 1.2s infinite; }
.dot:nth-child(2) { animation-delay:.18s; }
.dot:nth-child(3) { animation-delay:.36s; }
@keyframes dotB { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-4px);opacity:1} }

/* Input bar */
.chat-input-bar {
  flex-shrink:0; padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(253,252,248,.98); border-top:1px solid var(--ink-10);
  display:flex; align-items:flex-end; gap:8px;
  max-width:600px; width:100%; margin:0 auto;
}
.chat-field {
  flex:1; border:1.5px solid var(--ink-10); border-radius:22px;
  padding:10px 16px; font-size:14px; font-family:var(--font-sans); color:var(--ink);
  background:white; resize:none; outline:none;
  line-height:1.5; max-height:110px; overflow-y:auto;
  transition:border-color .2s;
}
.chat-field:focus { border-color:rgba(194,105,42,.5); }
.chat-field::placeholder { color:var(--ink-20); }
.chat-send {
  width:42px; height:42px; background:var(--ink); border:none;
  border-radius:50%; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.chat-send:disabled { background:var(--ink-10); }
.chat-send:not(:disabled):active { transform:scale(.88); }
.chat-send svg { width:16px; height:16px; }

/* input bar wrapper — takes full width */
.chat-input-wrap {
  flex-shrink:0;
  display:flex; flex-direction:column; align-items:center;
  background:rgba(253,252,248,.98); border-top:1px solid var(--ink-10);
}
</style>
<script src="/js/error-tracker.js"></script>
</head>

<!-- NAV -->
<nav class="top-nav">

<script>
// ── Context config ────────────────────────────────────────────
const _urlParams = new URLSearchParams(location.search);
const _for  = _urlParams.get('for')  || 'child';
const _mode = _urlParams.get('mode') || '';      // 'report' = 从报告页跳转的深聊
const REPORT_DEEPCHAT_KEY = 'aipiwen_report_deepchat';
let _subjectAge = null;   // 被测者年龄，由年龄芯片选择设置

// ── 邀请来源捕获 & 本机邀请 token ─────────────────────────────
(function() {
  try {
    // 被邀请人：保存来源 token
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref && /^[0-9a-f]{10}$/.test(ref)) localStorage.setItem('aipiwen_ref', ref);
  } catch(e) {}
})();
// 读取来源 token（会在首次 API 调用时传给服务端以积分邀请人）
let _refToken = null;
try { _refToken = localStorage.getItem('aipiwen_ref') || null; } catch(e) {}
// 本机生成的邀请 token（懒加载，分享时用）
let _myInviteToken = null;
try { _myInviteToken = localStorage.getItem('aipiwen_invite_token') || null; } catch(e) {}

async function getMyInviteToken() {
  if (_myInviteToken) return _myInviteToken;
  try {
    const r = await fetch('/api/invite?action=create');
    const d = await r.json();
    if (d.ok && d.token) {
      _myInviteToken = d.token;
      localStorage.setItem('aipiwen_invite_token', d.token);
    }
  } catch(e) {}
  return _myInviteToken;
}

function setAge(btn, age) {
  _subjectAge = age;
  document.querySelectorAll('.age-chip').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  updateSubmitBtn();
}

const CONTEXTS = {
  child: {
    pageTitle:   'AIPIWEN · 读懂孩子',
    eyebrow:     '亲子行为解读',
    title:       '那个让你揪心的<br><em>孩子行为</em>',
    sub:         '用你自己的话说就好，不用分析，不用措辞准确。AI 会帮你听见孩子没有说出口的那句话。',
    label:       '最近最让你困惑或揪心的，是孩子的什么？',
    placeholder: '例如：孩子一催作业就崩溃发脾气，我说什么都没用，不知道哪里出了问题…',
    ctaText:     '帮我读懂这个孩子',
    chips:       ['一催作业就崩溃发脾气', '情绪突然失控，一点小事就哭闹', '手机停不下来，怎么说都不听', '放学回来什么都不说，沉默关门', '在学校跟同学起冲突', '半夜睡不着，总是很焦虑'],
  },
  self: {
    pageTitle:   'AIPIWEN · 读懂自己',
    eyebrow:     '自我行为解读',
    title:       '那个你<em>改不掉</em>的<br>自己',
    sub:         '描述那个反复出现、你自己都说不清为什么的模式。AI 帮你看清它从哪里来，为什么改不了。',
    label:       '什么行为让你最困扰自己？',

  };
  const TITLE_MAP = {
    child:    'AI 正在理解孩子的行为…',
    self:     'AI 正在理解你的行为…',
    partner:  'AI 正在理解伴侣的行为…',
    business: 'AI 正在理解合伙人的行为…',
  };

      if (i >= steps.length) { setTimeout(resolve, 400); return; }
      const el = document.createElement('div');

      el.style.animationDelay = (i * 0.1) + 's';

      setTimeout(() => el.classList.add('done'), 300);
      i++;
      setTimeout(addStep, 650);
    }
    addStep();
  });
}

// ── 历史记忆（非亲子场景）────────────────────────────────────
// 存储：localStorage key = aipiwen_mem_{context}
// 结构：[{date, behavior, insight}, ...] 最多5条
const MEM_KEY = `aipiwen_mem_${_for}`;

function loadMemory() {
  try { return JSON.parse(localStorage.getItem(MEM_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveMemorySession(behavior, firstAIReply) {
  // 所有场景都保存到 localStorage，供跨场景综合分析使用
  // child 场景的 aipiwen-core Redis 记忆体系独立运行，互不干扰
  try {
    const mem = loadMemory();
    mem.unshift({
      date:     new Date().toLocaleDateString('zh-CN'),
      behavior: behavior.slice(0, 60),
      insight:  firstAIReply.replace(/<br>/g, ' ').slice(0, 100),
    });
    mem.splice(5); // 保留最近5次
    localStorage.setItem(MEM_KEY, JSON.stringify(mem));
  } catch(e) {}
}

function buildPreviousContext() {
  // 优先：从报告页跳转时存入 sessionStorage 的报告摘要
  // 摘要含性格类型关键词 → guest-chat.js 自动注入完整 TRC 知识库
  try {
    const reportCtx = sessionStorage.getItem(REPORT_DEEPCHAT_KEY);
    if (reportCtx) {
      sessionStorage.removeItem(REPORT_DEEPCHAT_KEY);
      return reportCtx;
    }
  } catch(e) {}

  // 常规：本地历史记忆
  const mem = loadMemory();
  if (!mem.length) return '';
  return mem.slice(0, 3).map((m, i) =>
    `${i + 1}. [${m.date}] 用户描述："${m.behavior}" — AI发现：${m.insight}`
  ).join('\n');
}

function showMemoryNotice() {
  const mem = loadMemory();
  if (!mem.length) return;
  const bar = document.querySelector('.reset-bar');
  if (!bar) return;
  const pill = document.createElement('div');
  pill.style.cssText = 'font-size:11px;color:var(--amber);padding:0 0 8px;display:flex;align-items:center;gap:4px;';
  pill.innerHTML = `<span>📝</span><span>AI 记住了你的 ${mem.length} 次历史对话</span>`;
  bar.appendChild(pill);
}

let chatHistory = [];

// ── mode=report：从报告页跳转，自动预填并直接提交 ─────────────────────────
if (_mode === 'report') {
  // 等页面渲染完毕后触发，避免 submitBehavior 找不到 DOM
  window.addEventListener('DOMContentLoaded', () => {

    const ageRow = document.getElementById('age-row');
    if (ageRow) ageRow.style.display = 'none';

    setTimeout(() => submitBehavior(), 300);
  });
}
let _sessionId = '';          // 每次对话唯一ID，用于服务端日志

async function submitBehavior() {
  const behavior = document.getElementById('behavior-input').value.trim();
  if (behavior.length < 4) return;

  // 生成本次会话唯一ID（用于服务端日志）
  if (!_sessionId) {
    _sessionId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  // Save to localStorage
  try {
    localStorage.setItem('aipiwen_behavior_input', JSON.stringify({
      behavior, inputAt: new Date().toISOString()
    }));
  } catch(e) {}

  // Generate report ID
  const d = new Date();
  currentReportId = `AIPIWEN-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;

  isProcessing = true;
  sessionPrevContext = buildPreviousContext();

  // Switch to LOADING phase
  document.getElementById('phase-form').style.display = 'none';
  document.getElementById('phase-loading').style.display = 'flex';

  // Local analysis runs in parallel with animation (亲子场景专用)
  let cardData = null;
  if (_for === 'child') {
    try {
      const analysis = AIPIWEN.AnalysisEngine.analyze(behavior, []);
      const content  = AIPIWEN.ContentLibrary.lightReport(analysis);
      cardData = {
        insight:   content.shareSummary || content.insight || '',
        typeLabel: content.label || '',
      };
    } catch(e) { console.warn('analysis', e); }
  }

  // Play loading animation (~3s)
  await runLoadingAnimation();

  // Switch to chat phase
  document.getElementById('phase-loading').style.display = 'none';
  const chatEl = document.getElementById('phase-chat');
  chatEl.style.display = 'flex';
  document.body.classList.add('chat-mode');

  // Show user bubble
  appendUserBubble(behavior);

  // 亲子场景才显示分析卡片
  if (cardData?.insight) {
    appendAnalysisCard(cardData);
    window._cardInsight = cardData.insight; // 供 openShare() 兜底用
  }

  // 显示记忆提示（非亲子）
  showMemoryNotice();

  // AI follow-up
  const t2 = appendThinking();
  try {
    const reply = await callAPI(behavior);
    t2.remove();
    appendAIBubble(reply);
    // 拿到回复后再入历史，避免 callAPI 时 history 里已含 behavior 再加 content=behavior 变成两条连续 user
    chatHistory.push({ role:'user', content: behavior });
    chatHistory.push({ role:'ai', content: reply });
    // 首次回复后保存本次 session 到记忆
    saveMemorySession(behavior, reply);
    // 显示分享按钮
    showShareButton(reply);
    // 检查是否可以引导到综合分析
    checkAndShowSynthesisNudge();
  } catch(e) {
    t2.remove();
    appendAIBubble('你可以继续追问我：为什么会这样？或者：我具体该怎么做？');
  }

  isProcessing = false;
  scrollBottom();
}

// ── Chat send ─────────────────────────────────────────────────
async function sendChat() {
  if (isProcessing) return;
  const field = document.getElementById('chat-field');
  const text  = field.value.trim();
  if (!text) return;

  isProcessing = true;
  field.value = ''; field.style.height = 'auto';
  document.getElementById('chat-send').disabled = true;

  appendUserBubble(text);

  const t = appendThinking();
  try {
    const reply = await callAPI(text);
    t.remove();
    appendAIBubble(reply);
    // 拿到回复后再入历史，同上，避免两条连续 user
    chatHistory.push({ role:'user', content: text });
    chatHistory.push({ role:'ai', content: reply });
  } catch(e) {
    t.remove();
    appendAIBubble('抱歉，刚才没有接收到，可以再说一次吗？');
  }

  isProcessing = false;
  document.getElementById('chat-send').disabled = false;
  scrollBottom();
}

async function callAPI(content) {
  const body = {
    content,
    history:         chatHistory.slice(-8),
    context:         _for,
    previousContext: sessionPrevContext,
    sessionId:       _sessionId,
    subjectAge:      _subjectAge,        // 年龄分层：AI 自动调整解读语气
    refToken:        _refToken,          // 邀请来源 token（服务端积分，去重安全）
  };
  const headers = { 'Content-Type': 'application/json' };
  const _vip = localStorage.getItem('aipiwen_vip') || '';
  if (_vip) headers['x-vip-token'] = _vip;
  const res = await fetch('/api/guest-chat', {
    method: 'POST',
    headers,
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  // 软限额提醒：等 token 拿到再拼链接
  if (data.soft) {
    const tok = await getMyInviteToken().catch(() => null);
    const inviteUrl = tok
      ? `https://aipiwen.cn?ref=${tok}`
      : 'https://aipiwen.cn';
    return (data.reply || '') + `\n\n👉 邀请朋友体验（+3次）：${inviteUrl}`;
  }
  return data.reply || '…';
}

    img.alt = '扫码进入 aipiwen.cn';
    img.crossOrigin = 'anonymous';
    img.style.cssText = 'width:64px;height:64px;display:block;border-radius:6px;background:#FDFCF8;';
    img.onerror = () => {
      qrEl.innerHTML = '<div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.35;color:#1A1714;background:#FDFCF8;border-radius:6px;">扫码进入<br>aipiwen.cn</div>';
    };
    qrEl.innerHTML = '';
    qrEl.appendChild(img);
  }

  if (window.QRCode) {
    try {
      new QRCode(qrEl, {
        text: url,
        width: 64, height: 64,
        colorDark:  '#1A1714',
        colorLight: '#FDFCF8',
        correctLevel: QRCode.CorrectLevel.M,
      });
      setTimeout(installFallbackImage, 120);
      return;
    } catch (e) {}
  }

  installFallbackImage();
}

// ── 分享卡片（html2canvas → 可长按保存的图 + 转发语选择器）────────
function showShareCard(insight) {
  const CTX_TAG    = { child:'亲子理解', self:'自我理解', partner:'伴侣理解', business:'合伙理解' };
  const CTX_MODULE = { child:'亲子行为解读', self:'自我行为解读', partner:'伴侣行为解读', business:'合伙行为解读' };

  // 提取洞察片段（去 HTML 标签）
  const clean = insight.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'');
  const first = (clean.match(/^(.{20,120})[。！？\n]/) || [,''])[1] || clean.slice(0, 120);
  const snippet = first;

  // 填入离屏渲染卡
  document.getElementById('src-content').textContent = first + '……';
  document.getElementById('src-tag').textContent     = CTX_TAG[_for]    || '行为理解';
  document.getElementById('src-module').textContent  = CTX_MODULE[_for] || '行为深度解读';

  // 生成二维码（带邀请 token，朋友扫码进来后积分给当前用户）
  const qrEl = document.getElementById('src-qr');
  const defaultShareUrl = 'https://aipiwen.cn';
  renderShareQr(qrEl, defaultShareUrl);
  getMyInviteToken().then(tok => {
    const shareUrl = tok ? `https://aipiwen.cn?ref=${tok}` : defaultShareUrl;
    renderShareQr(qrEl, shareUrl);
  }).catch(() => {
    renderShareQr(qrEl, defaultShareUrl);
  });

  // 重置弹层为加载态
  document.getElementById('share-img-area').innerHTML =
    '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:60px 0;text-align:center;">⏳ 生成分享图…</div>';
  document.getElementById('share-img-hint').style.display = 'none';
  const capArea = document.getElementById('share-caption-area');
  capArea.innerHTML = '';

  document.getElementById('share-overlay').classList.add('show');

  // 等 QR 渲染完后 html2canvas（增大超时确保QR码canvas已绘制）
  setTimeout(() => {
    const cardEl = document.getElementById('share-card-for-canvas');
    if (typeof html2canvas === 'undefined') {
      document.getElementById('share-img-area').innerHTML =
        '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:20px;text-align:center;">请截图保存</div>';
      if (window.SHARE) SHARE.renderCaptionPicker(capArea, _for, _subjectAge, snippet);
      return;
    }
    // 把QR码canvas内容转为img，避免html2canvas跨域canvas问题
    if (!document.querySelector('#src-qr canvas,#src-qr img')) {
      renderShareQr(qrEl, defaultShareUrl);
    }
    const qrCanvas = document.querySelector('#src-qr canvas');
    if (qrCanvas) {
      try {
        const qrImg = document.createElement('img');
        qrImg.src = qrCanvas.toDataURL('image/png');
        qrImg.style.cssText = qrCanvas.style.cssText + ';width:64px;height:64px;display:block;';
        qrCanvas.parentNode.replaceChild(qrImg, qrCanvas);
      } catch(e) {}
    }
    html2canvas(cardEl, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#1A1714', logging: false,
    }).then(canvas => {
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('share-img-area').innerHTML =
        `<img src="${dataUrl}" alt="分享图" style="border-radius:16px;">`;
      document.getElementById('share-img-hint').style.display = 'block';
      if (window.SHARE) SHARE.renderCaptionPicker(capArea, _for, _subjectAge, snippet);
    }).catch(err => {
      console.warn('html2canvas failed:', err);
      document.getElementById('share-img-area').innerHTML =
        '<div style="color:rgba(255,255,255,.35);font-size:13px;padding:20px;text-align:center;">请截图保存</div>';
      if (window.SHARE) SHARE.renderCaptionPicker(capArea, _for, _subjectAge, snippet);
    });
  }, 700);
}

function closeShareCard() {
  document.getElementById('share-overlay').classList.remove('show');
}

// #share-overlay 在 DOM 靠后位置（line 1123），此脚本早于它执行
// 用 readyState 守卫，避免 null.addEventListener 错误
(function () {
  function _bindShareOverlay() {
    var el = document.getElementById('share-overlay');
    if (el) el.addEventListener('click', function (e) {
      if (e.target === this) closeShareCard();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _bindShareOverlay);
  } else {
    _bindShareOverlay();
  }
})();
