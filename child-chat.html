<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>读懂身边的人 · AIPIWEN</title>
<style>
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --ok:         #3A7D5E;
  --font-serif: Georgia,'Noto Serif SC','Source Han Serif SC',serif;
  --font-sans:  -apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:var(--font-sans);
  background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column;
}

/* ── NAV ── */
.top-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--ink-10);
  background:rgba(253,252,248,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:10; flex-shrink:0;
}
.nav-back {
  display:flex; align-items:center; gap:5px;
  font-size:14px; color:var(--ink-40); cursor:pointer;
  text-decoration:none; border:none; background:none;
}
.nav-back svg { width:18px; height:18px; }
.nav-wordmark { font-size:13px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); }

/* ── PHASE 1: FORM ── */
#phase-form {
  flex:1; overflow-y:auto;
}
.page-wrap { max-width:520px; margin:0 auto; padding:40px 24px 80px; }
.page-eyebrow { font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:14px; }
.page-title { font-family:var(--font-serif); font-size:28px; line-height:1.3; letter-spacing:-.3px; color:var(--ink); font-weight:normal; margin-bottom:12px; }
.page-title em { font-style:italic; color:var(--amber); }
.page-sub { font-size:15px; line-height:1.75; color:var(--ink-70); margin-bottom:32px; }

.input-card {
  background:white; border:1.5px solid var(--ink-10);
  border-radius:18px; padding:20px; margin-bottom:20px;
  transition:border-color .2s;
}
.input-card:focus-within { border-color:var(--amber); }
.input-label { font-size:13px; font-weight:600; color:var(--ink-70); margin-bottom:10px; }
.input-textarea {
  width:100%; min-height:110px;
  font-family:var(--font-sans); font-size:16px; line-height:1.7; color:var(--ink);
  border:none; outline:none; resize:none; background:transparent; padding:0;
}
.input-textarea::placeholder { color:var(--ink-20); }
.input-counter { text-align:right; font-size:11px; color:var(--ink-20); margin-top:8px; }

.examples-label { font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--ink-40); text-transform:uppercase; margin-bottom:10px; }
.example-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
.example-chip {
  padding:7px 14px; background:var(--cream-deep); border:1px solid var(--ink-10);
  border-radius:20px; font-size:13px; color:var(--ink-70); cursor:pointer;
  transition:background .15s, border-color .15s;
}
.example-chip:active,
.example-chip:hover   { background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
.example-chip.selected { background:var(--amber); border-color:var(--amber); color:white; }

.cta-btn {
  display:block; width:100%; padding:18px 24px;
  background:var(--amber); color:white; border:none; border-radius:16px;
  font-family:var(--font-sans); font-size:17px; font-weight:700;
  cursor:pointer; text-align:center;
  box-shadow:0 6px 20px rgba(194,105,42,.35);
  transition:transform .18s, box-shadow .18s;
}
.cta-btn:active   { transform:scale(.97); box-shadow:0 3px 10px rgba(194,105,42,.25); }
.cta-btn:disabled { background:var(--ink-10); color:var(--ink-40); box-shadow:none; cursor:not-allowed; }
.cta-note { text-align:center; font-size:12px; color:var(--ink-40); margin-top:12px; line-height:1.6; }
.privacy-bar { margin-top:36px; padding-top:24px; border-top:1px solid var(--ink-10); font-size:12px; color:var(--ink-40); line-height:1.7; text-align:center; }

/* ── PHASE 2: CHAT ── */
#phase-chat { flex:1; display:none; flex-direction:column; overflow:hidden; }

.chat-scroll {
  flex:1; overflow-y:auto;
  padding:20px 16px 12px;
  display:flex; flex-direction:column; gap:14px;
  -webkit-overflow-scrolling:touch;
  max-width:600px; width:100%; margin:0 auto;
}
.chat-scroll::-webkit-scrollbar { width:3px; }
.chat-scroll::-webkit-scrollbar-thumb { background:var(--ink-10); border-radius:2px; }

/* 重新描述 */
.reset-bar {
  max-width:600px; width:100%; margin:0 auto;
  padding:10px 16px 0;
}
.reset-btn {
  font-size:12px; color:var(--ink-40); background:none; border:none;
  cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:4px;
}
.reset-btn:hover { color:var(--amber); }

/* Bubbles */
.bubble-row { display:flex; gap:10px; align-items:flex-end; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row.ai   { justify-content:flex-start; }
.ai-avatar {
  width:30px; height:30px; background:var(--ink); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--amber); flex-shrink:0;
}
.bubble {
  max-width:78%; padding:12px 16px;
  font-size:14px; line-height:1.72; word-break:break-word;
}
.bubble.user { background:var(--amber); color:white; border-radius:18px 18px 4px 18px; }
.bubble.ai   { background:white; border:1px solid var(--ink-10); border-radius:18px 18px 18px 4px; color:var(--ink-70); box-shadow:0 1px 6px rgba(0,0,0,.05); }

/* Analysis card */
.card-row { display:flex; gap:10px; align-items:flex-start; }
.analysis-card {
  max-width:82%;
  background:linear-gradient(135deg,#1A1714 0%,#2E2520 100%);
  border-radius:18px 18px 18px 4px; padding:22px 20px 18px;
  position:relative; overflow:hidden;
}
.card-orb { position:absolute; border-radius:50%; background:var(--amber); pointer-events:none; }
.card-orb-1 { width:140px; height:140px; top:-55px; right:-40px; opacity:.09; }
.card-orb-2 { width:100px; height:100px; bottom:-35px; left:-30px; opacity:.07; }
.card-eye   { font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-bottom:12px; position:relative; }
.card-insight { font-family:var(--font-serif); font-size:15px; line-height:1.65; color:white; margin-bottom:16px; position:relative; }
.card-divider { height:1px; background:rgba(255,255,255,.1); margin-bottom:12px; }
.card-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; position:relative; }
.card-id  { font-size:10px; color:rgba(255,255,255,.25); font-family:monospace; }
.card-tag { font-size:10px; font-weight:700; background:var(--amber); color:white; border-radius:5px; padding:3px 9px; }
.card-actions { display:flex; gap:8px; position:relative; }
.card-btn {
  flex:1; padding:9px 8px; border-radius:10px; font-size:12px; font-weight:600;
  border:none; cursor:pointer; text-align:center; transition:opacity .15s;
}
.card-btn:active { opacity:.75; }
.card-btn.primary { background:var(--amber); color:white; }
.card-btn.ghost   { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }

/* Thinking */
.thinking-dots {
  display:flex; gap:5px; padding:14px 18px;
  background:white; border:1px solid var(--ink-10);
  border-radius:18px 18px 18px 4px; box-shadow:0 1px 6px rgba(0,0,0,.05);
}
.dot { width:6px; height:6px; background:rgba(26,23,20,.25); border-radius:50%; animation:dotB 1.2s infinite; }
.dot:nth-child(2) { animation-delay:.18s; }
.dot:nth-child(3) { animation-delay:.36s; }
@keyframes dotB { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-4px);opacity:1} }

/* Input bar */
.chat-input-bar {
  flex-shrink:0; padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(253,252,248,.98); border-top:1px solid var(--ink-10);
  display:flex; align-items:flex-end; gap:8px;
  max-width:600px; width:100%; margin:0 auto;
}
.chat-field {
  flex:1; border:1.5px solid var(--ink-10); border-radius:22px;
  padding:10px 16px; font-size:14px; font-family:var(--font-sans); color:var(--ink);
  background:white; resize:none; outline:none;
  line-height:1.5; max-height:110px; overflow-y:auto;
  transition:border-color .2s;
}
.chat-field:focus { border-color:rgba(194,105,42,.5); }
.chat-field::placeholder { color:var(--ink-20); }
.chat-send {
  width:42px; height:42px; background:var(--ink); border:none;
  border-radius:50%; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.chat-send:disabled { background:var(--ink-10); }
.chat-send:not(:disabled):active { transform:scale(.88); }
.chat-send svg { width:16px; height:16px; }

/* input bar wrapper — takes full width */
.chat-input-wrap {
  flex-shrink:0;
  display:flex; flex-direction:column; align-items:center;
  background:rgba(253,252,248,.98); border-top:1px solid var(--ink-10);
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="top-nav">
  <button class="nav-back" onclick="handleBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    返回
  </button>
  <div class="nav-wordmark">AIPIWEN</div>
  <div style="width:60px"></div>
</nav>

<!-- ══ PHASE 1: FORM ══ -->
<div id="phase-form">
  <div class="page-wrap">
    <div class="page-eyebrow" id="form-eyebrow">行为理解</div>
    <h1 class="page-title" id="form-title">描述一个让你<em>困惑</em>的<br>孩子行为</h1>
    <p class="page-sub" id="form-sub">不需要完美描述，用你自己的话说就好。AI 会帮你读懂它背后的含义。</p>

    <div class="input-card">
      <div class="input-label" id="form-label">孩子最近让你困惑的行为是？</div>
      <textarea class="input-textarea" id="behavior-input"
        placeholder="例如：孩子总是不肯写作业，一说就发脾气…"
        maxlength="300" oninput="onInput(this)"></textarea>
      <div class="input-counter"><span id="char-count">0</span> / 300</div>
    </div>

    <div class="examples-label">常见场景，点击填入</div>
    <div class="example-chips" id="example-chips"></div>

    <button class="cta-btn" id="submit-btn" onclick="submitBehavior()" disabled>
      👉 <span id="cta-text">生成AI理解报告</span>
    </button>
    <div class="cta-note">免费生成 · 2分钟内看到结果</div>
    <div class="privacy-bar">你的描述仅用于本次分析，不会被存储或分享给第三方</div>
  </div>
</div>

<!-- ══ PHASE 2: CHAT ══ -->
<div id="phase-chat">
  <div class="reset-bar">
    <button class="reset-btn" onclick="backToForm()">← 重新描述</button>
  </div>
  <div class="chat-scroll" id="chat-scroll"></div>
  <div class="chat-input-wrap">
    <div class="chat-input-bar">
      <textarea class="chat-field" id="chat-field"
        placeholder="继续追问…"
        rows="1"
        oninput="onChatInput(this)"
        onkeydown="handleChatKey(event)"></textarea>
      <button class="chat-send" id="chat-send" onclick="sendChat()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="js/aipiwen-core.js"></script>
<script>
// ── Context config ────────────────────────────────────────────
const _for = new URLSearchParams(location.search).get('for') || 'child';

const CONTEXTS = {
  child: {
    pageTitle:   'AIPIWEN · 亲子理解',
    eyebrow:     '行为理解 · 亲子',
    title:       '描述一个让你<em>困惑</em>的<br>孩子行为',
    sub:         '不需要完美描述，用你自己的话说就好。AI 会帮你读懂它背后的含义。',
    label:       '孩子最近让你困惑的行为是？',
    placeholder: '例如：孩子总是不肯写作业，一说就发脾气…',
    ctaText:     '生成AI理解报告',
    chips:       ['不写作业，一催就发脾气', '情绪容易崩溃，一点小事就哭', '沉迷手机，怎么说都不听', '回家就沉默，什么都不说', '在学校跟同学起冲突', '半夜睡不着，总是焦虑'],
  },
  self: {
    pageTitle:   'AIPIWEN · 认识自己',
    eyebrow:     '自我理解',
    title:       '描述一个让你<em>困惑</em>的<br>自身行为',
    sub:         'AI 帮你看见行为背后的心理规律，从而更好地理解自己。',
    label:       '最近让你困惑的自身行为是？',
    placeholder: '例如：明知道该做，却一直拖延，对自己也没有办法…',
    ctaText:     '分析我的行为模式',
    chips:       ['一直拖延，道理都懂就是做不到', '忍不住反复担心，停不下来', '总想讨好别人，很难拒绝', '遇到压力就想逃避', '情绪波动大，难以自控', '总是低估自己'],
  },
  partner: {
    pageTitle:   'AIPIWEN · 理解伴侣',
    eyebrow:     '亲密关系理解',
    title:       '描述一个让你<em>困惑</em>的<br>伴侣行为',
    sub:         'AI 帮你看见另一半行为背后的真实需求，找到更好的沟通方式。',
    label:       '伴侣最近让你困惑的行为是？',
    placeholder: '例如：一不开心就沉默，怎么问都说没事…',
    ctaText:     '读懂这个行为',
    chips:       ['一不开心就沉默说没事', '遇到冲突就回避，不正面解决', '情绪激烈但很快平复', '控制欲很强，干涉过多', '总说累了但不说具体原因', '对我忽冷忽热'],
  },
  business: {
    pageTitle:   'AIPIWEN · 理解伙伴',
    eyebrow:     '合伙关系理解',
    title:       '描述一个影响合作的<br><em>伙伴行为</em>',
    sub:         'AI 帮你看见合伙人行为背后的动因，化解合作中的分歧。',
    label:       '合伙人让你困惑的行为是？',
    placeholder: '例如：遇到压力就退缩，重要决策总是推不动…',
    ctaText:     '分析这个行为',
    chips:       ['遇到压力就退缩，难推进决策', '嘴上同意，行动上总是拖延', '有想法但执行时没有耐心', '分歧时情绪化、上升到个人', '对细节极度纠结，影响进度', '独自承担，不愿意分工'],
  },
};

const CTX = CONTEXTS[_for] || CONTEXTS.child;
document.title = CTX.pageTitle;
document.getElementById('form-eyebrow').textContent  = CTX.eyebrow;
document.getElementById('form-title').innerHTML      = CTX.title;
document.getElementById('form-sub').textContent      = CTX.sub;
document.getElementById('form-label').textContent    = CTX.label;
document.getElementById('behavior-input').placeholder = CTX.placeholder;
document.getElementById('cta-text').textContent      = CTX.ctaText;

// render chips
const chipsEl = document.getElementById('example-chips');
CTX.chips.forEach(txt => {
  const d = document.createElement('div');
  d.className = 'example-chip'; d.textContent = txt;
  d.onclick = () => fillExample(txt, d);
  chipsEl.appendChild(d);
});

// ── Form state ───────────────────────────────────────────────
const selectedChips = new Set();

function onInput(el) {
  document.getElementById('char-count').textContent = el.value.length;
  document.getElementById('submit-btn').disabled = el.value.trim().length < 4;
}

function fillExample(text, el) {
  if (selectedChips.has(text)) { selectedChips.delete(text); el.classList.remove('selected'); }
  else { selectedChips.add(text); el.classList.add('selected'); }
  const ta = document.getElementById('behavior-input');
  ta.value = Array.from(selectedChips).join('，');
  ta.dispatchEvent(new Event('input'));
}

function handleBack() { history.back(); }
function backToForm() {
  // 清空聊天状态，避免旧对话混入下一次 session
  chatHistory       = [];
  currentReportId   = '';
  sessionPrevContext = '';
  isProcessing      = false;
  document.getElementById('chat-scroll').innerHTML = '';

  document.getElementById('phase-chat').style.display = 'none';
  document.getElementById('phase-form').style.display = 'block';
}

// ── 历史记忆（非亲子场景）────────────────────────────────────
// 存储：localStorage key = aipiwen_mem_{context}
// 结构：[{date, behavior, insight}, ...] 最多5条
const MEM_KEY = `aipiwen_mem_${_for}`;

function loadMemory() {
  try { return JSON.parse(localStorage.getItem(MEM_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveMemorySession(behavior, firstAIReply) {
  // 所有场景都保存到 localStorage，供跨场景综合分析使用
  // child 场景的 aipiwen-core Redis 记忆体系独立运行，互不干扰
  try {
    const mem = loadMemory();
    mem.unshift({
      date:     new Date().toLocaleDateString('zh-CN'),
      behavior: behavior.slice(0, 60),
      insight:  firstAIReply.replace(/<br>/g, ' ').slice(0, 100),
    });
    mem.splice(5); // 保留最近5次
    localStorage.setItem(MEM_KEY, JSON.stringify(mem));
  } catch(e) {}
}

function buildPreviousContext() {
  const mem = loadMemory();
  if (!mem.length) return '';
  return mem.slice(0, 3).map((m, i) =>
    `${i + 1}. [${m.date}] 用户描述："${m.behavior}" — AI发现：${m.insight}`
  ).join('\n');
}

function showMemoryNotice() {
  const mem = loadMemory();
  if (!mem.length) return;
  const bar = document.querySelector('.reset-bar');
  if (!bar) return;
  const pill = document.createElement('div');
  pill.style.cssText = 'font-size:11px;color:var(--amber);padding:0 0 8px;display:flex;align-items:center;gap:4px;';
  pill.innerHTML = `<span>📝</span><span>AI 记住了你的 ${mem.length} 次历史对话</span>`;
  bar.appendChild(pill);
}

// ── Submit → enter chat phase ────────────────────────────────
let chatHistory = [];
let currentReportId = '';
let isProcessing = false;
let sessionPrevContext = ''; // 每次 session 开始时设置，全程复用

async function submitBehavior() {
  const behavior = document.getElementById('behavior-input').value.trim();
  if (behavior.length < 4) return;

  // Save to localStorage
  try {
    localStorage.setItem('aipiwen_behavior_input', JSON.stringify({
      behavior, inputAt: new Date().toISOString()
    }));
  } catch(e) {}

  // Switch to chat phase
  document.getElementById('phase-form').style.display = 'none';
  const chatEl = document.getElementById('phase-chat');
  chatEl.style.display = 'flex';

  // Generate report ID
  const d = new Date();
  currentReportId = `AIPIWEN-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;

  isProcessing = true;

  // 读取本场景的历史记忆（非亲子），在整个 session 内复用
  sessionPrevContext = buildPreviousContext();

  // Show user's behavior as a bubble
  appendUserBubble(behavior);

  // Show thinking
  const thinking = appendThinking();

  // Local analysis (亲子场景专用)
  let cardData = null;
  if (_for === 'child') {
    try {
      const analysis = AIPIWEN.AnalysisEngine.analyze(behavior, []);
      const content  = AIPIWEN.ContentLibrary.lightReport(analysis);
      cardData = {
        insight:   content.shareSummary || content.insight || '',
        typeLabel: content.label || '',
      };
    } catch(e) { console.warn('analysis', e); }
  }

  thinking.remove();

  // 亲子场景才显示分析卡片
  if (cardData?.insight) appendAnalysisCard(cardData);

  // 显示记忆提示（非亲子）
  showMemoryNotice();

  // AI follow-up
  const t2 = appendThinking();
  try {
    const reply = await callAPI(behavior);
    t2.remove();
    appendAIBubble(reply);
    // 拿到回复后再入历史，避免 callAPI 时 history 里已含 behavior 再加 content=behavior 变成两条连续 user
    chatHistory.push({ role:'user', content: behavior });
    chatHistory.push({ role:'ai', content: reply });
    // 首次回复后保存本次 session 到记忆
    saveMemorySession(behavior, reply);
    // 检查是否可以引导到综合分析
    checkAndShowSynthesisNudge();
  } catch(e) {
    t2.remove();
    appendAIBubble('你可以继续追问我：为什么会这样？或者：我具体该怎么做？');
  }

  isProcessing = false;
  scrollBottom();
}

// ── Chat send ─────────────────────────────────────────────────
async function sendChat() {
  if (isProcessing) return;
  const field = document.getElementById('chat-field');
  const text  = field.value.trim();
  if (!text) return;

  isProcessing = true;
  field.value = ''; field.style.height = 'auto';
  document.getElementById('chat-send').disabled = true;

  appendUserBubble(text);

  const t = appendThinking();
  try {
    const reply = await callAPI(text);
    t.remove();
    appendAIBubble(reply);
    // 拿到回复后再入历史，同上，避免两条连续 user
    chatHistory.push({ role:'user', content: text });
    chatHistory.push({ role:'ai', content: reply });
  } catch(e) {
    t.remove();
    appendAIBubble('抱歉，刚才没有接收到，可以再说一次吗？');
  }

  isProcessing = false;
  document.getElementById('chat-send').disabled = false;
  scrollBottom();
}

async function callAPI(content) {
  const body = {
    content,
    history:         chatHistory.slice(-8),
    context:         _for,
    previousContext: sessionPrevContext, // 注入历史记忆（非亲子场景有值）
  };
  const res = await fetch('/api/guest-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data.reply || '…';
}

// ── Render helpers ────────────────────────────────────────────
function appendUserBubble(text) {
  const row = mk('div', 'bubble-row user');
  row.innerHTML = `<div class="bubble user">${esc(text)}</div>`;
  chatArea().appendChild(row);
  scrollBottom();
  return row;
}

function appendAIBubble(text) {
  const row = mk('div', 'bubble-row ai');
  row.innerHTML = `<div class="ai-avatar">AI</div><div class="bubble ai">${esc(text).replace(/\n/g,'<br>')}</div>`;
  chatArea().appendChild(row);
  scrollBottom();
  return row;
}

function appendAnalysisCard(data) {
  const row = mk('div', 'card-row');
  row.innerHTML = `
    <div class="ai-avatar">AI</div>
    <div class="analysis-card">
      <div class="card-orb card-orb-1"></div>
      <div class="card-orb card-orb-2"></div>
      <div class="card-eye">AI · 行为解读</div>
      <div class="card-insight">${esc(data.insight)}</div>
      <div class="card-divider"></div>
      <div class="card-meta">
        <div class="card-id">${esc(currentReportId)}</div>
        ${data.typeLabel ? `<div class="card-tag">${esc(data.typeLabel)}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="card-btn primary" onclick="openReport()">📊 完整报告</button>
        <button class="card-btn ghost"   onclick="openShare()">↗ 分享</button>
      </div>
    </div>`;
  chatArea().appendChild(row);
  scrollBottom();
  return row;
}

function appendThinking() {
  const row = mk('div', 'bubble-row ai');
  row.innerHTML = `<div class="ai-avatar">AI</div><div class="thinking-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea().appendChild(row);
  scrollBottom();
  return row;
}

function openReport() { window.location.href = `full-report.html?id=${encodeURIComponent(currentReportId)}&for=${_for}`; }
function openShare()  { window.location.href = `full-report.html?id=${encodeURIComponent(currentReportId)}&for=${_for}&screen=share`; }

// ── 跨场景综合分析引导 ─────────────────────────────────────────
function checkAndShowSynthesisNudge() {
  const CONTEXT_KEYS = ['child', 'self', 'partner', 'business'];
  const filled = CONTEXT_KEYS.filter(k => {
    try {
      return JSON.parse(localStorage.getItem('aipiwen_mem_' + k) || '[]').length > 0;
    } catch(e) { return false; }
  });
  if (filled.length < 2) return; // 不够2个场景，不显示

  // 避免重复显示
  if (document.getElementById('synthesis-nudge')) return;

  const LABELS = { child:'孩子', self:'自己', partner:'伴侣', business:'伙伴' };
  const labelStr = filled.map(k => LABELS[k] || k).join('、');

  const nudge = document.createElement('div');
  nudge.id = 'synthesis-nudge';
  nudge.style.cssText = `
    margin:16px 0 8px;
    padding:12px 16px;
    background:linear-gradient(135deg,rgba(194,105,42,.08),rgba(194,105,42,.04));
    border:1px solid rgba(194,105,42,.2);
    border-radius:14px;
    display:flex; align-items:center; gap:10px;
    cursor:pointer;
  `;
  nudge.innerHTML = `
    <span style="font-size:20px;flex-shrink:0">🔮</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:600;color:var(--amber);margin-bottom:2px">你已分析了 ${filled.length} 段关系（${labelStr}）</div>
      <div style="font-size:11px;color:var(--ink-40);line-height:1.4">点击查看跨场景综合分析，AI 找出它们之间的联系 →</div>
    </div>
  `;
  nudge.onclick = () => { window.location.href = 'synthesis.html'; };
  chatArea().appendChild(nudge);
  scrollBottom();
}

// ── Input resize ──────────────────────────────────────────────
function onChatInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  document.getElementById('chat-send').disabled = el.value.trim().length < 1;
}
function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

// ── Utils ─────────────────────────────────────────────────────
function chatArea() { return document.getElementById('chat-scroll'); }
function scrollBottom() { const c = chatArea(); requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; }); }
function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
