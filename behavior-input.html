<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>读懂孩子 · AIPIWEN</title>
<!-- 此页已合并至 child-chat.html，自动跳转（含 bfcache 处理） -->
<script>
window.location.replace('/child-chat.html');
window.addEventListener('pageshow', function(e) { window.location.replace('/child-chat.html'); });
</script>
<style>
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --amber-glow: rgba(194,105,42,.12);
  --ok:         #3A7D5E;
  --font-serif: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-sans:  -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body {
  font-family: var(--font-sans);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* NAV */
.top-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-10);
  background: rgba(253,252,248,.94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 10;
}
.nav-back {
  display: flex; align-items: center; gap: 5px;
  font-size: 14px; color: var(--ink-40); cursor: pointer;
  text-decoration: none;
}
.nav-back svg { width: 18px; height: 18px; }
.nav-wordmark {
  font-size: 13px; font-weight: 800;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
}

/* MAIN */
.page-wrap {
  max-width: 520px; margin: 0 auto;
  padding: 40px 24px 80px;
}
.page-eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 14px;
}
.page-title {
  font-family: var(--font-serif);
  font-size: 28px; line-height: 1.3; letter-spacing: -.3px;
  color: var(--ink); font-weight: normal; margin-bottom: 12px;
}
.page-title em { font-style: italic; color: var(--amber); }
.page-sub {
  font-size: 15px; line-height: 1.75; color: var(--ink-70); margin-bottom: 32px;
}

/* INPUT AREA */
.input-card {
  background: white;
  border: 1.5px solid var(--ink-10);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  transition: border-color .2s;
}
.input-card:focus-within { border-color: var(--amber); }

.input-label {
  font-size: 13px; font-weight: 600; color: var(--ink-70); margin-bottom: 10px;
}
.input-textarea {
  width: 100%; min-height: 110px;
  font-family: var(--font-sans); font-size: 16px;
  line-height: 1.7; color: var(--ink);
  border: none; outline: none; resize: none;
  background: transparent; padding: 0;
}
.input-textarea::placeholder { color: var(--ink-20); }
.input-counter {
  text-align: right; font-size: 11px;
  color: var(--ink-20); margin-top: 8px;
}

/* EXAMPLES */
.examples-label {
  font-size: 12px; font-weight: 600; letter-spacing: .06em;
  color: var(--ink-40); text-transform: uppercase; margin-bottom: 10px;
}
.example-chips {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px;
}
.example-chip {
  padding: 7px 14px;
  background: var(--cream-deep);
  border: 1px solid var(--ink-10);
  border-radius: 20px;
  font-size: 13px; color: var(--ink-70);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.example-chip:active,
.example-chip:hover { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.example-chip.selected { background: var(--amber); border-color: var(--amber); color: white; }

/* CTA */
.cta-btn {
  display: block; width: 100%;
  padding: 18px 24px;
  background: var(--amber);
  color: white;
  border: none; border-radius: 16px;
  font-family: var(--font-sans);
  font-size: 17px; font-weight: 700;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 6px 20px rgba(194,105,42,.35);
  transition: transform .18s, box-shadow .18s;
}
.cta-btn:active { transform: scale(.97); box-shadow: 0 3px 10px rgba(194,105,42,.25); }
.cta-btn:disabled { background: var(--ink-10); color: var(--ink-40); box-shadow: none; cursor: not-allowed; }

.cta-note {
  text-align: center; font-size: 12px; color: var(--ink-40);
  margin-top: 12px; line-height: 1.6;
}

/* PRIVACY */
.privacy-bar {
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--ink-10);
  font-size: 12px; color: var(--ink-40); line-height: 1.7; text-align: center;
}
</style>
</head>
<body>

<nav class="top-nav">
  <a class="nav-back" href="homepage.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    返回
  </a>
  <div class="nav-wordmark">AIPIWEN</div>
  <div style="width:40px"></div>
</nav>

<div class="page-wrap">
  <div class="page-eyebrow">行为理解 · 第一步</div>
  <h1 class="page-title">
    描述一个让你<em>困惑</em>的<br>孩子行为
  </h1>
  <p class="page-sub">不需要完美描述，用你自己的话说就好。AI 会帮你读懂它背后的含义。</p>

  <div class="input-card">
    <div class="input-label">孩子最近让你困惑的行为是？</div>
    <textarea
      class="input-textarea"
      id="behavior-input"
      placeholder="例如：孩子总是不肯写作业，一说就发脾气…"
      maxlength="300"
      oninput="onInput(this)"
    ></textarea>
    <div class="input-counter"><span id="char-count">0</span> / 300</div>
  </div>

  <div class="examples-label">常见场景，点击填入</div>
  <div class="example-chips">
    <div class="example-chip" onclick="fillExample('不写作业，一催就发脾气',this)">不写作业，一催就发脾气</div>
    <div class="example-chip" onclick="fillExample('情绪容易崩溃，一点小事就哭',this)">情绪容易崩溃，一点小事就哭</div>
    <div class="example-chip" onclick="fillExample('沉迷手机，怎么说都不听',this)">沉迷手机，怎么说都不听</div>
    <div class="example-chip" onclick="fillExample('回家就沉默，什么都不说',this)">回家就沉默，什么都不说</div>
    <div class="example-chip" onclick="fillExample('在学校跟同学起冲突',this)">在学校跟同学起冲突</div>
    <div class="example-chip" onclick="fillExample('半夜睡不着，总是焦虑',this)">半夜睡不着，总是焦虑</div>
  </div>

  <button class="cta-btn" id="submit-btn" onclick="goNext()" disabled>
    👉 生成AI理解报告
  </button>
  <div class="cta-note">免费生成 · 2分钟内看到结果</div>

  <div class="privacy-bar">
    你的描述仅用于本次分析，不会被存储或分享给第三方
  </div>
</div>

<script>
const STORAGE_KEY = 'aipiwen_behavior_input';

function onInput(el) {
  const val = el.value;
  document.getElementById('char-count').textContent = val.length;
  document.getElementById('submit-btn').disabled = val.trim().length < 4;
}

// 已选中的chip文本集合
const selectedChips = new Set();

function fillExample(text, el) {
  const ta = document.getElementById('behavior-input');
  if (selectedChips.has(text)) {
    // 取消选中：从集合和文本框移除
    selectedChips.delete(text);
    el.classList.remove('selected');
  } else {
    // 选中：追加到集合
    selectedChips.add(text);
    el.classList.add('selected');
  }
  // 重新拼接所有选中chip + 用户自己输入的部分（去掉之前chip的内容）
  ta.value = Array.from(selectedChips).join('，');
  ta.dispatchEvent(new Event('input'));
}

function goNext() {
  const behavior = document.getElementById('behavior-input').value.trim();
  if (!behavior || behavior.length < 4) return;
  // 初始化用户系统
  const user = (typeof AIPIWEN !== 'undefined') ? AIPIWEN.UserSystem.incrementSession() : { user_id: 'u_anon' };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      behavior,
      inputAt: new Date().toISOString(),
      user_id: user.user_id
    }));
  } catch(e) {}
  window.location.href = 'child-chat.html';
}
</script>
<script src="js/aipiwen-core.js"></script>
</body>
</html>
