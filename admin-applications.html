<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIPIWEN 指导师准入审核中心</title>
  <meta name="description" content="AIPIWEN 指导师平台准入审核">
  <link rel="stylesheet" href="static/ai-interpreter.css">
  <style>
    .admin-shell{width:min(1320px,calc(100% - 48px))}.admin-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.admin-summary strong{font-size:24px}.admin-review-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.75fr);gap:16px;align-items:start}.admin-application-table .table-head,.admin-application-table .table-row{grid-template-columns:1fr 1fr .7fr .8fr 1fr 72px 68px}.admin-application-table .table-row.selected{background:rgba(82,213,232,.08);box-shadow:inset 3px 0 0 var(--cyan)}.admin-empty{padding:28px 18px;text-align:center}.admin-detail{position:sticky;top:18px}.admin-detail-list{display:grid;margin:0}.admin-detail-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid rgba(149,173,211,.12)}.admin-detail-item dt{color:var(--faint);font-size:12px}.admin-detail-item dd{margin:0;overflow-wrap:anywhere}.admin-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.admin-actions label{grid-column:1/-1;display:grid;gap:7px;color:var(--faint);font-size:12px}.admin-actions textarea{min-height:82px;resize:vertical}.admin-view-button{min-height:30px;padding:5px 9px}@media(max-width:980px){.admin-summary,.admin-review-layout{grid-template-columns:1fr}.admin-detail{position:static}}@media(max-width:640px){.admin-shell{width:min(100% - 28px,1320px)}.admin-shell .public-nav{align-items:flex-start;flex-direction:column}}
  </style>
  <script src="static/v3a-admin.js" defer></script>
</head>
<body data-v3a-admin-page="applications">
  <main class="public-shell admin-shell">
    <nav class="public-nav" aria-label="平台准入审核导航">
      <a class="brand" href="admin-applications.html">
        <svg class="brand-flower" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle class="brand-flower-ring" cx="18" cy="18" r="15.5" stroke-width=".9" stroke-dasharray="2.5 6"/>
          <g class="brand-flower-petals">
            <ellipse cx="18" cy="12" rx="2.2" ry="6.5"/><ellipse cx="18" cy="12" rx="2.2" ry="6.5" transform="rotate(90 18 18)"/><ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(45 18 18)"/><ellipse cx="18" cy="12" rx="1.4" ry="5.5" transform="rotate(135 18 18)"/>
          </g>
          <circle class="brand-flower-center" cx="18" cy="18" r="3"/>
        </svg>
        <div><p class="brand-title">AIPIWEN 指导师准入审核中心</p><div class="brand-subtitle">平台准入审核后台</div></div>
      </a>
      <div class="top-actions">
        <a class="btn ghost" href="admin-unassigned.html">无归属客户</a>
        <span class="status info" id="v3a-admin-identity" hidden></span>
        <button class="btn ghost" id="v3a-admin-refresh" data-admin-action="refresh" type="button" hidden>刷新</button>
        <button class="btn" id="v3a-admin-logout" type="button" hidden>退出</button>
      </div>
    </nav>

    <section class="module" id="v3a-admin-gate" aria-live="polite">
      <span class="status pending" id="v3a-admin-gate-badge">权限检查中</span>
      <h1 id="v3a-admin-gate-title">正在验证平台超级管理员账号</h1>
      <p id="v3a-admin-gate-message">仅 active super_admin 可以进入。</p>
      <a class="btn ghost" href="login.html">前往统一登录</a>
    </section>

    <section id="v3a-admin-workspace" hidden>
      <div class="admin-summary">
        <div class="module metric amber"><span class="metric-label">待审核申请</span><strong id="v3a-admin-count">0</strong></div>
        <div class="module metric cyan"><span class="metric-label">当前管理员</span><strong id="v3a-admin-name">平台超级管理员</strong></div>
        <div class="module metric green"><span class="metric-label">最后刷新</span><strong id="v3a-admin-refreshed-at">-</strong></div>
      </div>
      <p class="dryrun-error" id="v3a-admin-error" role="status" aria-live="polite" hidden></p>
      <div class="module" id="v3a-admin-result" role="status" aria-live="polite" hidden></div>
      <div class="admin-review-layout">
        <section class="table-card admin-application-table" aria-labelledby="v3a-admin-list-title">
          <div class="card-header" style="padding:16px 16px 0"><div class="card-title"><h2 id="v3a-admin-list-title">pending 申请</h2><small>只展示待审核账号</small></div><span class="status pending">pending</span></div>
          <div class="table-head" aria-hidden="true"><span>姓名</span><span>手机号</span><span>城市</span><span>身份</span><span>申请时间</span><span>状态</span><span>操作</span></div>
          <div id="v3a-admin-list" aria-live="polite"></div>
          <div class="admin-empty" id="v3a-admin-empty" hidden><strong>当前没有待审核申请</strong></div>
        </section>

        <aside class="module admin-detail" aria-labelledby="v3a-admin-detail-title">
          <div class="card-header"><div class="card-title"><h2 id="v3a-admin-detail-title">申请详情</h2><small>手机号只显示脱敏信息</small></div><span class="status info">单事务审核</span></div>
          <div class="admin-empty" id="v3a-admin-detail-empty">点击列表中的“查看”。</div>
          <dl class="admin-detail-list" id="v3a-admin-detail-list" hidden></dl>
          <div class="admin-actions" id="v3a-admin-actions" hidden>
            <label>驳回原因（驳回时至少 10 个字符）
              <textarea id="v3a-admin-reject-reason" maxlength="500" placeholder="请填写明确、可复核的原因"></textarea>
            </label>
            <button class="btn primary" id="v3a-admin-approve" data-admin-action="approve" type="button">审核通过</button>
            <button class="btn warn" id="v3a-admin-reject" data-admin-action="reject" type="button">审核驳回</button>
          </div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
