<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AIPIWEN · 专属报告</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0E1118;--amber:#C2692A;--amber-dim:rgba(194,105,42,.32);
  --amber-glow:rgba(185,100,35,.5);--text:#FDFCF8;
  --dim:rgba(253,252,248,.6);--faint:rgba(253,252,248,.3);
  --card:rgba(255,255,255,.03);--border:rgba(255,255,255,.07);
  --w:390px;
}
html,body{height:100%;overflow:hidden;background:#060810;
  font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;color:var(--text);}

/* ── OUTER ── */
#outer{display:flex;align-items:center;justify-content:center;
  min-height:100%;min-height:100dvh;padding:0;}

/* ── VIEWER CARD ── */
#viewer{position:relative;width:var(--w);height:100vh;height:100dvh;
  overflow:hidden;background:var(--bg);
  box-shadow:0 0 120px rgba(194,105,42,.06),0 40px 80px rgba(0,0,0,.7);}
@media(min-height:860px){
  #viewer{height:860px;border-radius:28px;}
}
@media(max-width:430px){
  #outer{background:var(--bg);}
  #viewer{width:100vw;border-radius:0;height:100dvh;}
}

/* ── SLIDES TRACK ── */
#track{display:flex;height:100%;
  transition:transform .42s cubic-bezier(.25,.46,.45,.94);will-change:transform;}
.slide{
  flex:0 0 var(--w);width:var(--w);height:100%;
  overflow-y:auto;overflow-x:hidden;
  padding:60px 26px 72px;
  scrollbar-width:none;position:relative;
}
.slide::-webkit-scrollbar{display:none;}
@media(max-width:430px){.slide{flex:0 0 100vw;width:100vw;}}

/* ── TOP BAR ── */
#topbar{
  position:absolute;top:0;left:0;right:0;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:100;
  background:linear-gradient(var(--bg) 55%,transparent);
}
.tb-btn{
  display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:9px;color:var(--dim);font-size:12px;cursor:pointer;
  font-family:inherit;transition:background .2s;white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.10);}
.tb-logo{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--amber);}
.tb-right{display:flex;gap:6px;}

/* ── BOTTOM NAV ── */
#botnav{
  position:absolute;bottom:0;left:0;right:0;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:100;
  background:linear-gradient(transparent,rgba(14,17,24,.96) 22%);
}
.nav-btn{
  width:36px;height:36px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:50%;color:var(--text);
  font-size:15px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:background .2s;flex-shrink:0;
}
.nav-btn:hover{background:rgba(255,255,255,.12);}
.nav-btn:disabled{opacity:.25;cursor:default;}
#dots{display:flex;gap:5px;align-items:center;}
.dot{
  width:6px;height:6px;background:rgba(255,255,255,.2);
  border-radius:3px;transition:all .3s;cursor:pointer;
}
.dot.active{width:20px;background:var(--amber);}

/* ── TOC DRAWER ── */
#drawer{
  position:absolute;top:0;left:-105%;width:100%;height:100%;
  background:rgba(8,10,16,.97);backdrop-filter:blur(20px);
  z-index:200;padding:56px 24px 80px;
  transition:left .38s cubic-bezier(.25,.46,.45,.94);
  overflow-y:auto;scrollbar-width:none;
}
#drawer.open{left:0;}
#drawer::-webkit-scrollbar{display:none;}
#drawer-close{
  position:absolute;top:14px;right:16px;width:32px;height:32px;
  background:rgba(255,255,255,.07);border:none;border-radius:50%;
  color:var(--text);font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
}
.dr-label{font-size:10px;letter-spacing:.18em;color:var(--amber);
  text-transform:uppercase;margin-bottom:20px;font-weight:700;}
.dr-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:15px 0;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;
}
.dr-item:last-child{border-bottom:none;}
.dr-num{
  width:30px;height:30px;flex-shrink:0;
  border:1px solid var(--amber-dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--amber);margin-top:1px;
}
.dr-num.cur{background:var(--amber);color:var(--bg);border-color:var(--amber);}
.dr-title{font-size:15px;color:var(--text);line-height:1.35;}
.dr-sub{font-size:12px;color:var(--faint);margin-top:3px;}

/* ── SLIDE: COVER ── */
.cv-fp{text-align:center;margin:16px 0 20px;}
.cv-fp img{width:196px;height:196px;object-fit:contain;
  filter:drop-shadow(0 0 36px var(--amber-glow));}
.cv-type{font-family:Georgia,'Noto Serif SC',serif;font-size:38px;
  font-weight:700;text-align:center;color:var(--text);margin-bottom:8px;}
.cv-line{width:40px;height:2px;background:var(--amber);
  margin:0 auto 18px;border-radius:1px;}
.cv-tagline{font-size:13.5px;color:var(--dim);text-align:center;
  line-height:1.75;margin-bottom:24px;}
.cv-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:26px;}
.tag{border:1px solid var(--amber-dim);border-radius:20px;
  padding:5px 13px;font-size:11.5px;color:var(--dim);}
.cv-hr{border:none;border-top:1px solid rgba(255,255,255,.06);margin:0 0 16px;}
.cv-meta{font-size:11px;color:var(--faint);text-align:center;line-height:2.2;}
.cv-meta b{color:var(--amber);font-weight:600;}

/* ── SLIDE: CONTENT ── */
.sec-eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.15em;color:var(--amber);
  text-transform:uppercase;font-weight:700;margin-bottom:14px;
}
.sec-eyebrow::before{content:'';width:18px;height:1px;background:var(--amber);}
.sec-h{font-family:Georgia,'Noto Serif SC',serif;font-size:26px;
  font-weight:700;color:var(--text);margin-bottom:16px;line-height:1.3;}
.sec-body{font-size:14.5px;color:var(--dim);line-height:1.9;}
.sec-body strong{color:var(--text);font-weight:600;}
.sec-body em{color:var(--amber);font-style:normal;}
.sec-deco{float:right;margin:0 0 10px 14px;opacity:.15;}
.sec-deco img{width:72px;height:72px;object-fit:contain;}

/* ── FOUR-PART FORMAT ── */
.fp-parts{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
.fp-part{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 15px;
}
.fp-badge{display:inline-flex;align-items:center;gap:7px;
  margin-bottom:9px;}
.fp-badge-n{
  width:18px;height:18px;background:var(--amber);color:var(--bg);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.fp-badge-t{font-size:11px;font-weight:700;color:var(--amber);
  letter-spacing:.08em;text-transform:uppercase;}
.fp-text{font-size:13.5px;color:var(--dim);line-height:1.8;}
.fp-text strong{color:var(--text);}
.fp-text em{color:var(--amber);font-style:normal;}
.fp-cta{
  display:flex;align-items:center;gap:9px;
  background:rgba(194,105,42,.1);border:1px solid var(--amber-dim);
  border-radius:12px;padding:12px 14px;margin-top:4px;
  font-size:13px;color:var(--amber);cursor:pointer;
  transition:background .2s;font-family:inherit;width:100%;text-align:left;
}
.fp-cta:hover{background:rgba(194,105,42,.18);}

/* ── SLIDE: FINAL / CTA ── */
.fin-fp{text-align:center;margin:8px 0 18px;}
.fin-fp img{width:110px;height:110px;object-fit:contain;
  filter:drop-shadow(0 0 20px var(--amber-glow));}
.fin-h{font-family:Georgia,'Noto Serif SC',serif;font-size:22px;
  font-weight:700;text-align:center;margin-bottom:10px;}
.fin-sub{font-size:13px;color:var(--dim);text-align:center;
  line-height:1.75;margin-bottom:28px;}
.btn-row{display:flex;flex-direction:column;gap:10px;}
.btn-primary{
  width:100%;padding:15px;background:var(--amber);color:var(--bg);
  border:none;border-radius:14px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:opacity .2s;
}
.btn-primary:hover{opacity:.88;}
.btn-sec{
  width:100%;padding:14px;background:transparent;
  color:var(--dim);border:1px solid var(--border);
  border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit;
  transition:border-color .2s;
}
.btn-sec:hover{border-color:rgba(255,255,255,.18);color:var(--text);}
.fin-note{font-size:11.5px;color:var(--faint);text-align:center;
  margin-top:20px;line-height:1.7;}

/* ── SHARE MODAL ── */
#smodal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.88);backdrop-filter:blur(12px);
  z-index:1000;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;padding:24px;
}
#smodal.open{display:flex;}
/* fp-card (poster) — same system as wizard */
.fp-card{
  width:300px;background:var(--bg);
  border:1px solid rgba(194,105,42,.18);border-radius:18px;
  padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:0;
}
.fpc-brand{font-size:10px;font-weight:700;letter-spacing:.18em;
  color:var(--amber);text-transform:uppercase;margin-bottom:14px;
  align-self:flex-start;}
.fpc-fp{margin-bottom:12px;}
.fpc-fp img{width:150px;height:150px;object-fit:contain;
  filter:drop-shadow(0 0 22px var(--amber-glow));}
.fpc-type{font-family:Georgia,'Noto Serif SC',serif;font-size:30px;
  font-weight:700;color:var(--text);margin-bottom:6px;text-align:center;}
.fpc-hook{font-size:12px;color:var(--dim);text-align:center;
  line-height:1.65;margin-bottom:14px;white-space:pre-line;}
.fpc-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-bottom:14px;}
.fpc-tag{border:1px solid var(--amber-dim);border-radius:20px;
  padding:3px 10px;font-size:10.5px;color:var(--dim);}
.fpc-hr{width:100%;height:1px;background:rgba(255,255,255,.06);
  margin-bottom:10px;}
.fpc-foot{font-size:9.5px;color:var(--faint);text-align:center;
  letter-spacing:.08em;line-height:2;}
.fpc-foot b{color:var(--amber);}

.smodal-btns{display:flex;gap:10px;width:300px;}
.smodal-btns button{
  flex:1;padding:13px;border:none;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
}
#save-img{background:var(--amber);color:var(--bg);}
#close-share{background:rgba(255,255,255,.08);color:var(--dim);}

/* ── PRINT ── */
@media print{
  #topbar,#botnav,#drawer,#smodal{display:none!important;}
  #outer{display:block;}
  #viewer{box-shadow:none;border-radius:0;height:auto!important;overflow:visible;}
  #track{flex-direction:column;transform:none!important;height:auto;}
  .slide{flex:none;width:100%!important;height:auto;
    page-break-after:always;padding:36px 36px 36px;}
}
</style>
<script src="/js/error-tracker.js"></script>
</head>

// ─── POPULATE SLIDES ───
function init() {
  const R = REPORT;
  const imgKey = KEY2IMG[R.typeKey] || 'whorl';
  const fpSrc  = FP_IMGS[imgKey];

  // Cover
  document.getElementById('cover-fp').src    = fpSrc;
  document.getElementById('cover-type').textContent = R.type;
  document.getElementById('cover-tagline').textContent = R.tagline;
  const tagsEl = document.getElementById('cover-tags');
  R.tags.forEach(t => { const d=document.createElement('div'); d.className='tag'; d.textContent=t; tagsEl.appendChild(d); });
  document.getElementById('cover-meta').innerHTML =
    `报告编号 <b>${R.reportId}</b><br>生成日期 <b>${R.date}</b><br>皮纹速测 × AI 专属报告`;

  // Content slides
  document.getElementById('deco-fp1').src = fpSrc;
  setHTML('talent-body', R.content.talent.replace(/\n/g,'<br>'));
  setHTML('learn-body',  R.content.learn.replace(/\n/g,'<br>'));
  setHTML('guide-body',  R.content.guide.replace(/\n/g,'<br>'));
  setHTML('why-text',    R.content.why.replace(/\n/g,'<br>'));
  setHTML('how-text',    R.content.how.replace(/\n/g,'<br>'));
  setHTML('future-text', R.content.future.replace(/\n/g,'<br>'));
  document.getElementById('cta-text').textContent = R.content.cta;

  // Final slide
  document.getElementById('fin-fp').src = fpSrc;
  document.getElementById('fin-h').textContent = R.type + '，就是你。';
  document.getElementById('fin-sub').textContent =
    '这份报告拴着你孩子指尖上的数据。\n想聊更多，我在这里陪你。';

  // Share poster
  document.getElementById('poster-fp').src   = fpSrc;
  document.getElementById('poster-type').textContent = R.type;
  document.getElementById('poster-hook').textContent = (POSTER_HOOKS[R.typeKey] || POSTER_HOOKS['w']).replace(/\\n/g,'\n');
  const ptags = document.getElementById('poster-tags');
  R.tags.slice(0,3).forEach(t => { const d=document.createElement('div'); d.className='fpc-tag'; d.textContent=t; ptags.appendChild(d); });
}

function setHTML(id, html) {
  document.getElementById(id).innerHTML = html;
}

// ─── NAVIGATION ───
const track  = document.getElementById('track');
const slides = document.querySelectorAll('.slide');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const TOTAL   = slides.length;
let cur = 0;

function buildDots() {
  dotsEl.innerHTML = '';
  for (let i=0; i<TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i===0?' active':'');
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
  }
}

function goTo(n) {
  cur = Math.max(0, Math.min(n, TOTAL-1));
  track.style.transform = `translateX(-${cur * 100}%)`;
  dotsEl.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===cur));
  prevBtn.disabled = cur===0;
  nextBtn.disabled = cur===TOTAL-1;
  slides[cur].scrollTop = 0;
  // update drawer highlights
  document.querySelectorAll('.dr-num').forEach((el,i) => el.classList.toggle('cur', i===cur));
}

prevBtn.addEventListener('click', () => goTo(cur-1));
nextBtn.addEventListener('click', () => goTo(cur+1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(cur+1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp')    goTo(cur-1);
});

// Swipe
let tx = 0;
track.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
track.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 45) goTo(cur + (dx<0?1:-1));
}, {passive:true});

// ─── TOC DRAWER ───
const drawer = document.getElementById('drawer');
document.getElementById('toc-btn').addEventListener('click',    () => drawer.classList.add('open'));
document.getElementById('drawer-close').addEventListener('click',() => drawer.classList.remove('open'));

function buildDrawer() {
  const container = document.getElementById('drawer-items');
  slides.forEach((s, i) => {
    const title = s.dataset.title;
    const sub   = s.dataset.sub;
    const item  = document.createElement('div');
    item.className = 'dr-item';
    item.innerHTML = `
      <div class="dr-num${i===0?' cur':''}">${i+1}</div>
      <div><div class="dr-title">${title}</div>${sub?`<div class="dr-sub">${sub}</div>`:''} </div>`;
    item.addEventListener('click', () => { goTo(i); drawer.classList.remove('open'); });
    container.appendChild(item);
  });
}

// ─── DOWNLOAD (jsPDF multi-page flip-book) ───────────────────────────────────
async function generateReportPDF(btnEl, slideSelector) {
  const origText = btnEl ? btnEl.textContent : '';
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '生成中…'; }
  const renderDiv = document.createElement('div');
  Object.assign(renderDiv.style, {
    position: 'fixed', left: '-9999px', top: '0',
    width: '390px', background: '#0E1118', overflow: 'hidden', zIndex: '-999'
  });
  document.body.appendChild(renderDiv);
  try {
    const { jsPDF } = window.jspdf;
    const PW = 148, PH = 210; // A5 mm
    const pdf = new jsPDF({ unit: 'mm', format: [PW, PH] });
    const allSlides = [...document.querySelectorAll(slideSelector)];
    for (let i = 0; i < allSlides.length; i++) {
      if (i > 0) pdf.addPage([PW, PH], 'portrait');
      const clone = allSlides[i].cloneNode(true);
      Object.assign(clone.style, {
        width: '390px', height: 'auto', minHeight: 'auto',
        padding: '48px 26px 40px', background: '#0E1118',
        overflow: 'visible', display: 'flex', flexDirection: 'column'
      });
      renderDiv.innerHTML = '';
      renderDiv.appendChild(clone);
      await Promise.all([...clone.querySelectorAll('img')].map(img =>
        img.complete ? Promise.resolve()
                     : new Promise(r => { img.onload = r; img.onerror = r; })
      ));
      await new Promise(r => setTimeout(r, 80));
      const canvas = await html2canvas(renderDiv, {
        backgroundColor: '#0E1118', scale: 2, useCORS: true, logging: false, width: 390
      });
      const imgH_mm = (canvas.height / canvas.width) * PW;
      const yOff = Math.max(0, (PH - Math.min(imgH_mm, PH)) / 2);
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG',
                   0, yOff, PW, Math.min(imgH_mm, PH));
    }
    pdf.save('aipiwen-皮纹报告.pdf');
  } catch(e) {
    alert('PDF生成失败，请稍后重试。\n' + e.message);
  } finally {
    document.body.removeChild(renderDiv);
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = origText; }
  }
}
['dl-btn', 'dl-btn-fin'].forEach(id => {
  document.getElementById(id)?.addEventListener('click', function() {
    generateReportPDF(this, '#track .slide');
  });
});

// ─── SHARE MODAL ───
const smodal = document.getElementById('smodal');
function openShare() { smodal.classList.add('open'); }
document.getElementById('share-btn').addEventListener('click', openShare);
document.getElementById('share-open-btn').addEventListener('click', openShare);
document.getElementById('close-share').addEventListener('click', () => smodal.classList.remove('open'));

document.getElementById('save-img').addEventListener('click', async () => {
  const card = document.getElementById('poster-card');
  try {
    const canvas = await html2canvas(card, {
      backgroundColor: '#0E1118', scale: 3,
      useCORS: true, allowTaint: false
    });
    const link = document.createElement('a');
    link.download = `aipiwen-${REPORT.type}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('保存失败，请截图保存。'); }
});

// ─── BOOT ───
init();
buildDots();
buildDrawer();
goTo(0);
</script>
