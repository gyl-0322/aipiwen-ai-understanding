<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 育儿顾问 · AIPIWEN</title>
<style>
:root {
  --cream:      #FDFCF8;
  --cream-deep: #F5F3EE;
  --ink:        #1A1714;
  --ink-70:     #4A4540;
  --ink-40:     #8C8580;
  --ink-20:     #C8C3BC;
  --ink-10:     #EAE7E2;
  --amber:      #C2692A;
  --amber-soft: #F5EDE4;
  --font-serif: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-sans:  -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font-sans);
  background: var(--cream);
  color: var(--ink);
  height: 100%; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
.top-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--ink-10);
  background: rgba(253,252,248,.97);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  height: 54px;
}
.nav-back {
  display: flex; align-items: center; gap: 5px;
  font-size: 14px; color: var(--ink-40); text-decoration: none; cursor: pointer;
}
.nav-back svg { width: 16px; height: 16px; }
.nav-wordmark { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.nav-new-btn {
  font-size: 12px; color: var(--amber); cursor: pointer; padding: 4px 0;
  background: none; border: none; font-family: var(--font-sans);
}

/* ── STAGE BAR ── */
.stage-bar {
  position: fixed; top: 54px; left: 0; right: 0; z-index: 15;
  display: flex; gap: 0;
  background: var(--cream-deep);
  border-bottom: 1px solid var(--ink-10);
  height: 36px; align-items: center;
  padding: 0 16px; overflow: hidden;
}
.stage-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--ink-20);
  padding: 0 10px; white-space: nowrap;
  transition: color .3s;
}
.stage-item.active { color: var(--amber); }
.stage-item.done   { color: var(--ink-40); }
.stage-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-10); flex-shrink: 0;
  transition: background .3s;
}
.stage-item.active .stage-dot { background: var(--amber); }
.stage-item.done   .stage-dot { background: var(--ink-40); }
.stage-arrow { color: var(--ink-20); font-size: 10px; padding: 0 2px; }

/* ── CHAT AREA ── */
.chat-area {
  position: fixed;
  top: 90px; /* nav + stage bar */
  bottom: 72px;
  left: 0; right: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 0 8px;
}
.chat-inner { max-width: 520px; margin: 0 auto; padding: 0 14px; }

/* ── MESSAGE BUBBLES ── */
.msg-row { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
.msg-row.agent { justify-content: flex-start; }
.msg-row.user  { justify-content: flex-end; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--amber); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  align-self: flex-end;
}

.msg-bubble {
  max-width: 82%; padding: 12px 15px;
  border-radius: 18px; line-height: 1.75; font-size: 14px;
}
.msg-row.agent .msg-bubble {
  background: white;
  border: 1px solid var(--ink-10);
  border-bottom-left-radius: 5px;
  color: var(--ink-70);
}
.msg-row.user .msg-bubble {
  background: var(--amber);
  color: white;
  border-bottom-right-radius: 5px;
}

/* markdown within bubbles */
.msg-bubble strong { font-weight: 700; }
.msg-bubble em     { font-style: italic; }
.msg-bubble .quote-line {
  border-left: 3px solid rgba(194,105,42,.35);
  padding-left: 10px; color: var(--ink-40);
  font-size: 13px; margin: 4px 0;
}
.msg-row.user .msg-bubble .quote-line { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.8); }

/* ── ANALYSIS CARD (inline) ── */
.analysis-card {
  background: var(--amber-soft);
  border: 1px solid rgba(194,105,42,.25);
  border-radius: 14px; padding: 16px 18px; margin: 4px 0 14px;
  max-width: 82%; margin-left: 40px;
}
.analysis-card-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 6px;
}
.analysis-card-label {
  font-family: var(--font-serif); font-size: 17px; color: var(--ink);
  margin-bottom: 8px;
}
.analysis-card-link {
  display: inline-block; margin-top: 10px; padding: 8px 16px;
  background: var(--amber); color: white; border-radius: 20px;
  font-size: 13px; font-weight: 700; text-decoration: none;
}

/* ── TYPING INDICATOR ── */
.typing-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; }
.typing-bubble {
  background: white; border: 1px solid var(--ink-10);
  border-radius: 18px; border-bottom-left-radius: 5px;
  padding: 13px 16px; display: flex; gap: 5px; align-items: center;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-20); animation: typingPulse 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes typingPulse {
  0%, 80%, 100% { transform: scale(.8); opacity: .5; }
  40%           { transform: scale(1); opacity: 1; }
}

/* ── INPUT BAR ── */
.input-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(253,252,248,.97);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--ink-10);
  padding: 10px 14px; height: 72px;
  display: flex; align-items: center; gap: 10px;
}
.input-field {
  flex: 1; background: white; border: 1.5px solid var(--ink-10);
  border-radius: 24px; padding: 10px 18px;
  font-family: var(--font-sans); font-size: 15px; color: var(--ink);
  outline: none; resize: none; line-height: 1.5;
  max-height: 52px; overflow-y: auto;
  transition: border-color .2s;
}
.input-field:focus { border-color: var(--amber); }
.input-field::placeholder { color: var(--ink-20); }
.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--amber); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform .15s, opacity .15s;
}
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.send-btn:not(:disabled):active { transform: scale(.92); }
.send-btn svg { width: 18px; height: 18px; color: white; }

/* ── QUICK CHIPS（推荐场景）── */
.chip-row { display: flex; gap: 7px; flex-wrap: nowrap; overflow-x: auto; padding: 8px 14px 0; -webkit-overflow-scrolling: touch; }
.chip-row::-webkit-scrollbar { display: none; }
.quick-chip {
  white-space: nowrap; padding: 6px 13px;
  background: var(--cream-deep); border: 1px solid var(--ink-10);
  border-radius: 20px; font-size: 12px; color: var(--ink-70);
  cursor: pointer; flex-shrink: 0;
  transition: background .15s;
}
.quick-chip:active { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
</style>
</head>
<body>

<!-- NAV -->
<nav class="top-nav">
  <a class="nav-back" href="homepage.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    返回
  </a>
  <div class="nav-wordmark">AI 育儿顾问</div>
  <button class="nav-new-btn" onclick="newSession()">新对话</button>
</nav>

<!-- STAGE BAR -->
<div class="stage-bar">
  <div class="stage-item active" id="stage-intake">
    <div class="stage-dot"></div>了解情况
  </div>
  <div class="stage-arrow">›</div>
  <div class="stage-item" id="stage-exploration">
    <div class="stage-dot"></div>深入了解
  </div>
  <div class="stage-arrow">›</div>
  <div class="stage-item" id="stage-analysis">
    <div class="stage-dot"></div>行为分析
  </div>
  <div class="stage-arrow">›</div>
  <div class="stage-item" id="stage-recommendation">
    <div class="stage-dot"></div>应对建议
  </div>
</div>

<!-- CHAT AREA -->
<div class="chat-area" id="chat-area">
  <div class="chat-inner" id="chat-inner"></div>
</div>

<!-- INPUT BAR -->
<div class="input-bar">
  <textarea
    class="input-field" id="chat-input"
    placeholder="说说孩子让你困惑的行为…"
    rows="1"
    oninput="onInputChange()"
    onkeydown="onKeyDown(event)"
  ></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script src="js/aipiwen-core.js"></script>
<script>
/* ── 状态 ── */
let userId = '';
let currentSession = null;
let isProcessing = false;

const STAGES = ['intake', 'exploration', 'analysis', 'recommendation', 'complete'];

/* ── 初始化 ── */
window.addEventListener('DOMContentLoaded', function() {
  const user = AIPIWEN.UserSystem.getOrCreate();
  userId = user.user_id;

  const existing = AIPIWEN.ConsultingSessionStore.get(userId);

  if (existing && existing.turns.length > 0 && existing.stage !== 'complete') {
    // 恢复上次会话
    currentSession = existing;
    existing.turns.forEach(t => {
      if (t.role === 'agent') appendAgentBubble(t.text, false);
      else appendUserBubble(t.text);
    });
    updateStageBar(existing.stage);
  } else {
    // 新会话
    const { greeting, session } = AIPIWEN.AIPIWENConsultingAgent.startSession(userId);
    currentSession = session;
    appendAgentBubble(greeting, false);
    showQuickChips();
    updateStageBar('intake');
  }
  scrollToBottom(false);
});

/* ── 发送消息 ── */
function sendMessage() {
  if (isProcessing) return;
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('send-btn').disabled = true;
  hideQuickChips();
  appendUserBubble(text);
  scrollToBottom();

  isProcessing = true;
  showTyping();

  const delay = 900 + Math.random() * 600;
  setTimeout(function() {
    hideTyping();
    const result = AIPIWEN.AIPIWENConsultingAgent.processInput(userId, text, currentSession);
    currentSession = result.session;

    appendAgentBubble(result.response);

    // 分析完成 → 显示行为识别卡片
    if (result.action === 'analyze' && result.analysisResult) {
      setTimeout(function() {
        appendAnalysisCard(result.analysisResult, result.session);
      }, 300);
    }

    updateStageBar(result.stage);
    scrollToBottom();
    isProcessing = false;
  }, delay);
}

/* ── 快捷场景 ── */
const QUICK_CHIPS = ['不写作业、一催就闹', '情绪爆发、哭个不停', '沉迷手机、怎么说都不听', '回家就沉默、什么都不说', '在学校跟同学起冲突', '上学越来越抗拒'];

function showQuickChips() {
  if (document.getElementById('chip-row')) return;
  const chatInner = document.getElementById('chat-inner');
  const row = document.createElement('div');
  row.className = 'chip-row'; row.id = 'chip-row';
  QUICK_CHIPS.forEach(function(c) {
    const el = document.createElement('div');
    el.className = 'quick-chip';
    el.textContent = c;
    el.onclick = function() {
      document.getElementById('chat-input').value = c;
      onInputChange();
      hideQuickChips();
      sendMessage();
    };
    row.appendChild(el);
  });
  chatInner.appendChild(row);
}

function hideQuickChips() {
  const row = document.getElementById('chip-row');
  if (row) row.remove();
}

/* ── 渲染气泡 ── */
function appendAgentBubble(text, animate) {
  animate = animate !== false;
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `
    <div class="msg-avatar">A</div>
    <div class="msg-bubble">${renderMarkdown(text)}</div>
  `;
  if (animate) { row.style.opacity = '0'; row.style.transform = 'translateY(6px)'; }
  document.getElementById('chat-inner').appendChild(row);
  if (animate) {
    requestAnimationFrame(function() {
      row.style.transition = 'opacity .3s, transform .3s';
      row.style.opacity = '1'; row.style.transform = 'none';
    });
  }
  return row;
}

function appendUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
  row.style.opacity = '0';
  document.getElementById('chat-inner').appendChild(row);
  requestAnimationFrame(function() {
    row.style.transition = 'opacity .2s';
    row.style.opacity = '1';
  });
  return row;
}

function appendAnalysisCard(analysis, session) {
  const patternMeta = AIPIWEN.AnalysisEngine.PATTERNS[analysis.primary];
  const label = patternMeta ? patternMeta.label : '行为模式';

  const card = document.createElement('div');
  card.className = 'analysis-card';

  // Build report URL
  const lastLead = JSON.parse(localStorage.getItem('aipiwen_leads_v02') || '[]').slice(-1)[0];
  const reportId = lastLead ? lastLead.reportId : '';
  const stored   = JSON.parse(localStorage.getItem('aipiwen_behavior_input') || '{}');
  // Ensure behavior-input data is set for full-report.html
  try {
    localStorage.setItem('aipiwen_behavior_input', JSON.stringify({
      behavior: session.collected_info.behavior_raw,
      inputAt: new Date().toISOString(),
      user_id: userId
    }));
  } catch(e) {}

  card.innerHTML = `
    <div class="analysis-card-eyebrow">AI 行为识别结果</div>
    <div class="analysis-card-label">「${label}」</div>
    <div style="font-size:13px;color:var(--ink-40);line-height:1.7;">
      ${patternMeta ? patternMeta.category || '' : ''}
    </div>
    ${reportId ? `<a class="analysis-card-link" href="full-report.html?id=${encodeURIComponent(reportId)}">查看完整报告 →</a>` : ''}
  `;
  card.style.opacity = '0';
  document.getElementById('chat-inner').appendChild(card);
  requestAnimationFrame(function() {
    card.style.transition = 'opacity .4s';
    card.style.opacity = '1';
  });
  scrollToBottom();
}

/* ── Typing indicator ── */
function showTyping() {
  if (document.getElementById('typing-row')) return;
  const row = document.createElement('div');
  row.className = 'typing-row'; row.id = 'typing-row';
  row.innerHTML = `
    <div class="msg-avatar">A</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  document.getElementById('chat-inner').appendChild(row);
  scrollToBottom();
}
function hideTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

/* ── Stage bar ── */
const STAGE_IDS = {
  intake:         'stage-intake',
  exploration:    'stage-exploration',
  analysis:       'stage-analysis',
  recommendation: 'stage-recommendation',
  complete:       'stage-recommendation'
};
function updateStageBar(stage) {
  const order = ['intake', 'exploration', 'analysis', 'recommendation'];
  const idx   = order.indexOf(stage === 'complete' ? 'recommendation' : stage);
  order.forEach(function(s, i) {
    const el = document.getElementById('stage-' + s);
    if (!el) return;
    el.classList.remove('active', 'done');
    if (i < idx)  el.classList.add('done');
    if (i === idx) el.classList.add('active');
  });
}

/* ── New session ── */
function newSession() {
  if (!confirm('开始新对话？当前对话记录会被清除（历史行为分析仍然保留）。')) return;
  document.getElementById('chat-inner').innerHTML = '';
  const { greeting, session } = AIPIWEN.AIPIWENConsultingAgent.startSession(userId);
  currentSession = session;
  appendAgentBubble(greeting, false);
  showQuickChips();
  updateStageBar('intake');
  scrollToBottom(false);
}

/* ── Helpers ── */
function onInputChange() {
  const val = document.getElementById('chat-input').value;
  document.getElementById('send-btn').disabled = val.trim().length < 2;
}

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!document.getElementById('send-btn').disabled) sendMessage();
  }
}

function scrollToBottom(smooth) {
  const area = document.getElementById('chat-area');
  if (smooth === false) { area.scrollTop = area.scrollHeight; return; }
  setTimeout(function() { area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }); }, 80);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 简易 markdown → HTML（仅处理 **bold** 和 ›/› 引用行）
function renderMarkdown(text) {
  let html = escHtml(text);
  // **bold**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 段落换行
  const lines = html.split('\n');
  const result = lines.map(function(line) {
    if (/^›\s*/.test(line)) {
      return '<div class="quote-line">' + line.replace(/^›\s*/, '') + '</div>';
    }
    return line;
  });
  return result.join('<br>');
}
</script>
</body>
</html>
