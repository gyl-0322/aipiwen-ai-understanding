<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AIPIWEN · 后台日志</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0E0C0A;--surface:#1A1714;--border:rgba(255,255,255,.08);
    --ink:#EAE7E0;--ink-60:rgba(234,231,224,.6);--ink-40:rgba(234,231,224,.4);
    --amber:#C2692A;--amber-light:rgba(194,105,42,.15);
    --red:#E05A5A;--red-bg:rgba(224,90,90,.12);
    --child:#6B9E78;--self:#7B8EC8;--partner:#C87B8E;--business:#B8976B;
  }
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,sans-serif;min-height:100vh;}

  /* ── Login ── */
  #login-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }
  .login-title{font-size:20px;font-weight:600;margin-bottom:8px;}
  .login-sub{font-size:13px;color:var(--ink-60);margin-bottom:28px;}
  .login-input{
    width:100%;max-width:320px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;color:var(--ink);font-size:15px;
    outline:none;margin-bottom:12px;
  }
  .login-input:focus{border-color:var(--amber);}
  .login-btn{
    width:100%;max-width:320px;padding:14px;
    background:var(--amber);color:#fff;border:none;
    border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;
  }

  /* ── Main ── */
  #main-screen{display:none;}

  /* ── Topbar ── */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:var(--bg);border-bottom:1px solid var(--border);
    padding:12px 16px;
  }
  .topbar-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .topbar-title{font-size:15px;font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .topbar-count{font-size:12px;color:var(--ink-60);}
  .export-btn{
    padding:5px 12px;background:var(--amber);color:#fff;border:none;
    border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  }

  /* ── Page chips ── */
  .page-chips{display:flex;gap:6px;}
  .page-chip{
    padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;
    border:1.5px solid var(--border);background:transparent;color:var(--ink-60);
    cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .page-chip.active{
    background:var(--amber);border-color:var(--amber);color:#fff;
  }
  .page-chip.error-chip.active{
    background:var(--red);border-color:var(--red);color:#fff;
  }

  /* ── Filter tabs ── */
  .filters{
    padding:10px 16px;display:flex;gap:8px;overflow-x:auto;
    border-bottom:1px solid var(--border);
  }
  .filter-btn{
    padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;
    border:1px solid var(--border);background:transparent;color:var(--ink-60);
    cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .filter-btn.active{background:var(--amber);border-color:var(--amber);color:#fff;}

  /* ── Section panels ── */
  #panel-convs,#panel-errors{display:none;}
  #panel-convs.active,#panel-errors.active{display:block;}

  /* ── Session list ── */
  .session-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
  .session-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:14px 16px;cursor:pointer;
    transition:border-color .15s;
  }
  .session-card:hover{border-color:rgba(194,105,42,.4);}
  .sess-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .ctx-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .ctx-badge.child       {background:rgba(107,158,120,.2);color:#6B9E78;}
  .ctx-badge.self        {background:rgba(123,142,200,.2);color:#7B8EC8;}
  .ctx-badge.partner     {background:rgba(200,123,142,.2);color:#C87B8E;}
  .ctx-badge.business    {background:rgba(184,151,107,.2);color:#B8976B;}
  .ctx-badge.fingerprint {background:rgba(194,105,42,.18);color:#C2692A;}
  .ctx-badge.report      {background:rgba(90,140,200,.18);color:#5A8CC8;}
  .sess-time{font-size:11px;color:var(--ink-40);}
  .sess-first{font-size:13px;color:var(--ink-60);line-height:1.5;}
  .sess-ip{font-size:11px;color:var(--ink-40);margin-top:4px;}

  /* ── Error list ── */
  .error-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
  .error-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:14px 16px;
    transition:border-color .15s;
  }
  .error-card:hover{border-color:rgba(224,90,90,.4);}
  .err-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .err-badge{
    padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
    background:var(--red-bg);color:var(--red);flex-shrink:0;
  }
  .err-time{font-size:11px;color:var(--ink-40);}
  .err-page{font-size:11px;color:var(--ink-40);margin-bottom:6px;}
  .err-msg{font-size:13px;color:var(--ink);line-height:1.5;word-break:break-all;}
  .err-stack-toggle{
    margin-top:8px;font-size:11px;color:var(--ink-40);cursor:pointer;
    border:none;background:none;padding:0;text-decoration:underline;
  }
  .err-stack{
    display:none;margin-top:6px;padding:10px;
    background:rgba(0,0,0,.3);border-radius:8px;
    font-size:11px;color:var(--ink-40);line-height:1.6;
    white-space:pre-wrap;word-break:break-all;
    max-height:200px;overflow-y:auto;
  }
  .err-stack.open{display:block;}
  .err-ua{font-size:10px;color:var(--ink-40);margin-top:6px;opacity:.6;}

  .empty{padding:80px 24px;text-align:center;color:var(--ink-40);font-size:14px;}
  .loading{text-align:center;color:var(--ink-40);font-size:13px;padding:40px;}

  /* ── Conversation modal ── */
  #conv-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);}
  .conv-panel{
    position:absolute;inset:0;top:auto;
    background:var(--bg);border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    max-height:90vh;display:flex;flex-direction:column;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .conv-header{
    padding:16px 16px 12px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .conv-header-info{display:flex;align-items:center;gap:8px;}
  .conv-close{
    width:32px;height:32px;border-radius:50%;
    background:var(--surface);border:none;color:var(--ink-60);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .conv-msgs{flex:1;overflow-y:auto;padding:16px;}
  .msg{margin-bottom:14px;}
  .msg-role{font-size:11px;font-weight:600;margin-bottom:4px;}
  .msg-role.user{color:var(--amber);}
  .msg-role.ai{color:var(--ink-60);}
  .msg-bubble{
    font-size:13px;line-height:1.7;color:var(--ink);
    background:var(--surface);border-radius:12px;padding:12px 14px;
  }
  .msg-time{font-size:10px;color:var(--ink-40);margin-top:4px;}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login-screen">
  <div class="login-title">AIPIWEN 后台</div>
  <div class="login-sub">输入管理员密码查看日志</div>
  <input class="login-input" id="secret-input" type="password" placeholder="管理员密码"
    onkeydown="if(event.key==='Enter')login()">
  <button class="login-btn" onclick="login()">进入</button>
</div>

<!-- 主界面 -->
<div id="main-screen">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="page-chips">
        <button class="page-chip active" id="chip-convs" onclick="switchPanel('convs')">💬 对话记录</button>
        <button class="page-chip error-chip" id="chip-errors" onclick="switchPanel('errors')">🔴 错误日志</button>
      </div>
      <div class="topbar-right">
        <div class="topbar-count" id="count-label"></div>
        <button class="export-btn" id="export-btn" style="display:none" onclick="exportData()">导出 JSON</button>
      </div>
    </div>
  </div>

  <!-- 对话记录板块 -->
  <div id="panel-convs" class="active">
    <div class="filters" id="filter-bar">
      <button class="filter-btn active" onclick="filterCtx('all',this)">全部</button>
      <button class="filter-btn" onclick="filterCtx('fingerprint',this)">皮纹速测</button>
      <button class="filter-btn" onclick="filterCtx('child',this)">亲子行为</button>
      <button class="filter-btn" onclick="filterCtx('report',this)">报告解读</button>
      <button class="filter-btn" onclick="filterCtx('self',this)">自我</button>
      <button class="filter-btn" onclick="filterCtx('partner',this)">伴侣</button>
      <button class="filter-btn" onclick="filterCtx('business',this)">合伙</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>

  <!-- 错误日志板块 -->
  <div id="panel-errors">
    <div class="error-list" id="error-list">
      <div class="loading">加载中…</div>
    </div>
  </div>
</div>

<!-- 对话弹窗 -->
<div id="conv-modal" onclick="closeModal(event)">
  <div class="conv-panel">
    <div class="conv-header">
      <div class="conv-header-info">
        <span class="ctx-badge" id="modal-badge"></span>
        <span style="font-size:12px;color:var(--ink-60)" id="modal-time"></span>
      </div>
      <button class="conv-close" onclick="closeModal()">×</button>
    </div>
    <div class="conv-msgs" id="conv-msgs"></div>
  </div>
</div>

<script>
let _secret      = '';
let _allSessions = [];
let _currentCtx  = 'all';
let _errorLoaded = false;
let _currentPanel = 'convs';

// ── 登录 ──────────────────────────────────────────────────────────────────────
function login() {
  const s = document.getElementById('secret-input').value.trim();
  if (!s) return;
  _secret = s;
  loadSessions();
}

async function loadSessions() {
  const res = await fetch(`/api/admin-convs?secret=${encodeURIComponent(_secret)}`);
  if (res.status === 401) { alert('密码错误'); return; }
  const data = await res.json();
  _allSessions = data.sessions || [];
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display  = 'block';
  document.getElementById('export-btn').style.display   = 'block';
  renderList(_allSessions);
  updateCount();
}

// ── 面板切换 ──────────────────────────────────────────────────────────────────
function switchPanel(panel) {
  _currentPanel = panel;
  document.getElementById('panel-convs').classList.toggle('active', panel === 'convs');
  document.getElementById('panel-errors').classList.toggle('active', panel === 'errors');
  document.getElementById('chip-convs').classList.toggle('active', panel === 'convs');
  document.getElementById('chip-errors').classList.toggle('active', panel === 'errors');
  // 导出按钮：只在对话记录时显示
  document.getElementById('export-btn').style.display = panel === 'convs' ? 'block' : 'none';
  updateCount();
  if (panel === 'errors' && !_errorLoaded) loadErrors();
}

function updateCount() {
  const el = document.getElementById('count-label');
  if (_currentPanel === 'convs') {
    const shown = _currentCtx === 'all' ? _allSessions : _allSessions.filter(s => s.context === _currentCtx);
    el.textContent = `共 ${shown.length} 条`;
  } else {
    el.textContent = '';
  }
}

// ── 对话记录 ──────────────────────────────────────────────────────────────────
async function exportData() {
  const btn = document.getElementById('export-btn');
  btn.textContent = '导出中…'; btn.disabled = true;
  try {
    const res = await fetch(`/api/admin-convs?secret=${encodeURIComponent(_secret)}&action=export`);
    if (!res.ok) { alert('导出失败'); return; }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `aipiwen_sessions_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('导出出错：' + e.message);
  } finally {
    btn.textContent = '导出 JSON'; btn.disabled = false;
  }
}

function filterCtx(ctx, btn) {
  _currentCtx = ctx;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = ctx === 'all' ? _allSessions : _allSessions.filter(s => s.context === ctx);
  renderList(filtered);
  updateCount();
}

function renderList(sessions) {
  const list = document.getElementById('session-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">还没有对话记录</div>';
    return;
  }
  const CTX = { child:'亲子行为', self:'自我解读', partner:'伴侣解读', business:'合伙解读', fingerprint:'皮纹速测', report:'报告解读' };
  list.innerHTML = sessions.map(s => `
    <div class="session-card" onclick="openSession('${s.sessionId}','${s.context}','${esc(s.timeStr)}')">
      <div class="sess-head">
        <span class="ctx-badge ${s.context}">${CTX[s.context] || s.context}</span>
        <span class="sess-time">${s.timeStr || ''}</span>
      </div>
      <div class="sess-first">${esc(s.firstMsg || '')}</div>
      ${s.ip ? `<div class="sess-ip">IP: ${esc(s.ip)}</div>` : ''}
    </div>
  `).join('');
}

async function openSession(sid, ctx, timeStr) {
  document.getElementById('conv-modal').style.display = 'block';
  const CTX = { child:'亲子行为', self:'自我解读', partner:'伴侣解读', business:'合伙解读', fingerprint:'皮纹速测', report:'报告解读' };
  const badge = document.getElementById('modal-badge');
  badge.textContent = CTX[ctx] || ctx;
  badge.className = `ctx-badge ${ctx}`;
  document.getElementById('modal-time').textContent = timeStr;
  document.getElementById('conv-msgs').innerHTML = '<div class="loading">加载中…</div>';

  const res  = await fetch(`/api/admin-convs?secret=${encodeURIComponent(_secret)}&sid=${sid}`);
  const data = await res.json();
  const msgs = data.msgs || [];

  if (!msgs.length) {
    document.getElementById('conv-msgs').innerHTML = '<div class="loading">暂无消息</div>';
    return;
  }
  const ROLE = { user:'用户', ai:'AI' };
  document.getElementById('conv-msgs').innerHTML = msgs.map(m => `
    <div class="msg">
      <div class="msg-role ${m.role}">${ROLE[m.role] || m.role}</div>
      <div class="msg-bubble">${esc(m.content).replace(/\n/g,'<br>')}</div>
      <div class="msg-time">${m.ts ? new Date(m.ts).toLocaleTimeString('zh-CN') : ''}</div>
    </div>
  `).join('');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('conv-modal')) return;
  document.getElementById('conv-modal').style.display = 'none';
}

// ── 错误日志 ──────────────────────────────────────────────────────────────────
async function loadErrors() {
  _errorLoaded = true;
  const list = document.getElementById('error-list');
  list.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const res  = await fetch(`/api/error-log?secret=${encodeURIComponent(_secret)}&n=100`);
    if (res.status === 401) { list.innerHTML = '<div class="empty">密码验证失败</div>'; return; }
    const data = await res.json();
    renderErrors(data.errors || []);
  } catch(e) {
    list.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

function renderErrors(errors) {
  const list = document.getElementById('error-list');
  if (!errors.length) {
    list.innerHTML = '<div class="empty">暂无错误记录 🎉</div>';
    return;
  }
  list.innerHTML = errors.map((e, i) => {
    const timeStr = e.ts
      ? new Date(e.ts).toLocaleString('zh-CN', { timeZone:'Asia/Shanghai', hour12:false })
      : '';
    const hasStack = e.stack && e.stack.trim();
    return `
      <div class="error-card">
        <div class="err-head">
          <span class="err-badge">错误</span>
          <span class="err-time">${esc(timeStr)}</span>
        </div>
        ${e.page ? `<div class="err-page">页面：${esc(e.page)}</div>` : ''}
        <div class="err-msg">${esc(e.msg)}</div>
        ${hasStack ? `
          <button class="err-stack-toggle" onclick="toggleStack(this)">展开堆栈</button>
          <pre class="err-stack">${esc(e.stack)}</pre>
        ` : ''}
        ${e.context ? `<div class="err-ua" style="color:var(--ink-60);font-size:11px;margin-top:6px">场景：${esc(e.context.slice(0,120))}</div>` : ''}
        ${e.ua ? `<div class="err-ua">设备：${esc(e.ua)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function toggleStack(btn) {
  const pre = btn.nextElementSibling;
  const open = pre.classList.toggle('open');
  btn.textContent = open ? '收起堆栈' : '展开堆栈';
}

// ── 工具 ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
